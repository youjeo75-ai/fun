<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#151515; --page:#eae6dd; --paper:#fbf8f2; --muted:#8b8578;
    --display:'Archivo Black','Archivo',sans-serif; --body:'Archivo',-apple-system,'Segoe UI',sans-serif; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--page); font-family:var(--body); color:var(--ink); min-height:100vh; -webkit-font-smoothing:antialiased;
    background-image:radial-gradient(circle at 12% 15%, rgba(0,0,0,.035) 0, transparent 45%), radial-gradient(circle at 88% 85%, rgba(0,0,0,.035) 0, transparent 45%); }
  .wrap{ max-width:1040px; margin:0 auto; padding:56px 24px 80px; }
  header{ margin-bottom:44px; }
  .eyebrow{ font-weight:800; font-size:12px; letter-spacing:.04em; color:var(--muted); margin-bottom:14px; }
  h1{ font-family:var(--display); font-size:clamp(36px,6vw,64px); line-height:1.02; letter-spacing:-.02em; margin:0 0 16px; max-width:12em; }
  .lede{ font-size:17px; line-height:1.55; color:#5c5648; max-width:34em; margin:0; }

  .grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(310px,1fr)); gap:28px; }
  .game{ display:flex; flex-direction:column; text-align:left; font:inherit; color:inherit; background:var(--paper); border:none; border-radius:28px; padding:0; cursor:pointer; overflow:hidden;
    box-shadow:0 18px 40px -16px rgba(0,0,0,.3), 0 2px 0 rgba(0,0,0,.05); transition:transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s ease; }
  .game:hover{ transform:translateY(-6px) rotate(-.6deg); box-shadow:0 26px 50px -18px rgba(0,0,0,.38), 0 2px 0 rgba(0,0,0,.05); }
  .game:nth-child(2):hover{ transform:translateY(-6px) rotate(.6deg); }
  .game:focus-visible{ outline:3px solid var(--ink); outline-offset:4px; }
  .art{ height:230px; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .info{ padding:22px 26px 26px; }
  .info h2{ font-family:var(--display); font-size:26px; letter-spacing:-.01em; margin:0 0 8px; }
  .info p{ margin:0 0 18px; font-size:14.5px; line-height:1.55; color:#5c5648; }
  .meta{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .tags{ display:flex; gap:8px; flex-wrap:wrap; }
  .tag{ font-weight:700; font-size:12px; padding:6px 12px; border-radius:999px; border:1.5px solid #d8d2c4; color:#6b6355; }
  .play{ font-weight:800; font-size:13px; letter-spacing:.03em; text-transform:uppercase; color:#fff; background:var(--ink); border-radius:999px; padding:12px 20px; white-space:nowrap; }

  /* fermi art */
  .art.fermi{ background:#e9e4da; }
  .mini-card{ width:78%; border-radius:22px; padding:20px 20px 18px; color:#fff; background:linear-gradient(165deg,#4F5FEF,#3846C4 130%); transform:rotate(-2.5deg); box-shadow:0 14px 28px -10px rgba(0,0,0,.4); transition:transform .4s cubic-bezier(.2,.8,.2,1), background .4s ease; }
  .game:hover .mini-card{ transform:rotate(1.5deg) scale(1.03); }
  .mini-top{ display:flex; justify-content:space-between; font-family:var(--display); font-size:11px; margin-bottom:12px; opacity:.95; }
  .mini-q{ font-family:var(--display); font-size:19px; line-height:1.2; margin-bottom:14px; }
  .mini-field{ background:rgba(255,255,255,.22); border-radius:12px; padding:11px 14px; display:flex; justify-content:space-between; font-weight:700; font-size:12px; }
  .mini-field span:last-child{ font-size:10px; letter-spacing:.06em; }
  .dots{ position:absolute; bottom:12px; left:0; right:0; display:flex; justify-content:center; gap:6px; }
  .dots i{ width:7px; height:7px; border-radius:50%; background:rgba(0,0,0,.2); }
  .dots i:first-child{ width:20px; border-radius:5px; background:#151515; }

  /* size it up art */
  .art.size{ background: linear-gradient(#eeddc4 1px, transparent 1px) 0 0/34px 34px, linear-gradient(90deg,#eeddc4 1px, transparent 1px) 0 0/34px 34px, #fbeee0; }
  .art.size::after{ content:""; position:absolute; left:0; right:0; bottom:34px; height:2px; background:rgba(192,57,43,.6); }
  .art.size::before{ content:""; position:absolute; left:0; right:0; bottom:0; height:70px; background:linear-gradient(to top, rgba(192,57,43,.14), transparent); }
  .sil{ position:absolute; bottom:35px; }
  .sil svg{ width:100%; height:100%; display:block; }
  .sil.a{ left:9%; width:92px; color:#2c3e8c; }
  .sil.b{ left:36%; width:150px; color:#c0392b; transform-origin:bottom left; transition:transform .8s cubic-bezier(.2,.9,.25,1.1); }
  .game:hover .sil.b{ transform:scale(1.22); }
  .handle{ position:absolute; left:calc(36% + 142px); bottom:100px; width:24px; height:24px; border-radius:50%; background:#fff; border:2.5px solid #c0392b; box-shadow:0 3px 8px rgba(0,0,0,.25); transition:transform .8s cubic-bezier(.2,.9,.25,1.1); }
  .game:hover .handle{ transform:translate(34px,-20px); }

  /* travle art */
  .art.travle{ background:#2b2926; }
  .art.travle svg{ width:100%; height:100%; }
  .art.travle .route{ stroke-dasharray:6 7; animation:dash 1.6s linear infinite; }
  @keyframes dash{ to{ stroke-dashoffset:-26; } }
  .game:hover .art.travle .pin{ transform:scale(1.2); }
  .art.travle .pin{ transform-box:fill-box; transform-origin:center; transition:transform .35s cubic-bezier(.2,.9,.25,1.2); }

  footer{ margin-top:56px; font-size:13px; color:var(--muted); font-weight:600; }

  /* player */
  #player{ position:fixed; inset:0; z-index:50; background:var(--page); display:none; flex-direction:column; }
  #player.open{ display:flex; animation:fade .25s ease; }
  @keyframes fade{ from{opacity:0;} to{opacity:1;} }
  .bar{ height:52px; flex-shrink:0; display:flex; align-items:center; gap:14px; padding:0 16px; background:var(--ink); color:#fff; }
  .back{ font:inherit; font-weight:800; font-size:13px; color:var(--ink); background:#fff; border:none; border-radius:999px; padding:9px 16px; cursor:pointer; }
  .back:hover{ background:#F5C531; }
  .bar .title{ font-family:var(--display); font-size:15px; }
  .bar .sw{ margin-left:auto; display:flex; gap:6px; }
  .sw button{ font:inherit; font-weight:700; font-size:12px; color:#fff; background:transparent; border:1.5px solid rgba(255,255,255,.35); border-radius:999px; padding:7px 13px; cursor:pointer; }
  .sw button.on{ background:#fff; color:var(--ink); border-color:#fff; }
  #frame{ flex:1; border:0; width:100%; background:var(--page); }
  @media (prefers-reduced-motion:reduce){ *{ transition-duration:.01ms !important; animation-duration:.01ms !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Game library &middot; 3 games</div>
    <h1>Guess it. Size it. Get closer.</h1>
    <p class="lede">Small games about how big the world really is. Pick one and play; your sense of scale gets sharper every round.</p>
  </header>

  <main class="grid" id="grid">
    <button class="game" data-id="fermi" aria-label="Play Fermi">
      <div class="art fermi">
        <div class="mini-card">
          <div class="mini-top"><span>Fermi.gg</span><span>Q1 / 10</span></div>
          <div class="mini-q">How many people have ever lived on Earth?</div>
          <div class="mini-field"><span>your guess</span><span>PEOPLE</span></div>
        </div>
        <div class="dots"><i></i><i></i><i></i><i></i><i></i></div>
      </div>
      <div class="info">
        <h2>Fermi</h2>
        <p>Estimate real-world numbers, from heartbeats in a lifetime to ants on Earth, and see how many times too high or low you landed.</p>
        <div class="meta"><div class="tags"><span class="tag">150 questions</span><span class="tag">16 topics</span></div><span class="play">Play</span></div>
      </div>
    </button>

    <button class="game" data-id="size" aria-label="Play Size It Up">
      <div class="art size">
        <div class="sil a"><svg viewBox="0 0 200 85"><path d="M10,78 L10,50 C10,44 14,40 20,40 L34,40 L38,28 C40,24 44,22 48,22 L150,22 C156,22 160,25 162,30 L168,40 L182,40 C188,40 192,44 192,50 L192,78 L178,78 C178,68 170,60 160,60 C150,60 142,68 142,78 L60,78 C60,68 52,60 42,60 C32,60 24,68 24,78 Z" fill="currentColor"/><circle cx="42" cy="78" r="12" fill="currentColor"/><circle cx="160" cy="78" r="12" fill="currentColor"/></svg></div>
        <div class="sil b" style="height:75px"><svg viewBox="0 0 200 100"><path d="M8,88 C6,80 10,72 18,70 L20,55 C21,45 30,38 42,36 L46,20 C47,14 52,10 58,12 L64,18 C66,14 72,12 76,16 L80,24 L108,26 C130,27 150,34 165,42 C178,49 188,55 192,62 L192,80 C192,86 188,90 182,90 L176,90 L173,78 L166,78 L163,90 L120,90 L117,80 L110,80 L107,90 L60,90 L58,80 L52,80 L50,90 L18,90 C12,90 8,90 8,88 Z" fill="currentColor"/></svg></div>
        <div class="handle"></div>
      </div>
      <div class="info">
        <h2>Size It Up</h2>
        <p>Drag a silhouette until it matches its true size next to a familiar object, then watch it snap to the real thing.</p>
        <div class="meta"><div class="tags"><span class="tag">13 pairings</span><span class="tag">3, 5 or 8 rounds</span></div><span class="play">Play</span></div>
      </div>
    </button>

    <button class="game" data-id="travle" aria-label="Play travle">
      <div class="art travle">
        <svg viewBox="0 0 400 230" preserveAspectRatio="xMidYMid slice">
          <g fill="#373431" stroke="#4f4a44" stroke-width="2" stroke-linejoin="round">
            <path d="M40,150 L74,98 L128,86 L150,120 L122,168 L70,176 Z"/>
            <path d="M128,86 L190,54 L236,78 L226,126 L150,120 Z"/>
            <path d="M150,120 L226,126 L246,172 L190,200 L122,168 Z"/>
            <path d="M236,78 L300,60 L350,96 L332,150 L246,172 L226,126 Z"/>
          </g>
          <g fill="#89c2ae" opacity=".9"><path d="M128,86 L190,54 L236,78 L226,126 L150,120 Z"/></g>
          <g fill="#e195b0" opacity=".9"><path d="M236,78 L300,60 L350,96 L332,150 L246,172 L226,126 Z"/></g>
          <path class="route" d="M92,134 C130,120 170,100 195,92 C230,100 270,120 296,114" fill="none" stroke="#e8e0d2" stroke-width="3" stroke-linecap="round"/>
          <circle class="pin" cx="92" cy="134" r="9" fill="#e8d5a8"/>
          <circle class="pin" cx="296" cy="114" r="9" fill="#e04b3c"/>
        </svg>
      </div>
      <div class="info">
        <h2>travle</h2>
        <p>Name the countries that link two places in as few steps as you can. Every wrong turn tells you how many steps the detour cost.</p>
        <div class="meta"><div class="tags"><span class="tag">Countries &amp; cities</span><span class="tag">NL / EN</span></div><span class="play">Play</span></div>
      </div>
    </button>
  </main>
  <footer>Each game runs entirely in your browser. Nothing is uploaded.</footer>
</div>

<div id="player" role="dialog" aria-modal="true" aria-label="Game">
  <div class="bar">
    <button class="back" id="back">&larr; Library</button>
    <span class="title" id="ptitle"></span>
    <div class="sw" id="sw"></div>
  </div>
  <iframe id="frame" title="Game"></iframe>
</div>

<script>
const GAMES = {
  fermi:{ title:"Fermi", html: "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Fermi \u2014 how close can you guess?<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700;800&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{\n    --ink:#151515;\n    --page:#eae6dd;\n    --paper:#fbf8f2;\n    --white:#ffffff;\n    --font-display:'Archivo Black', 'Archivo', sans-serif;\n    --font-body:'Archivo', sans-serif;\n  }\n  *{box-sizing:border-box;}\n  html,body{margin:0;padding:0;}\n  body{\n    background:var(--page);\n    background-image:\n      radial-gradient(circle at 15% 20%, rgba(0,0,0,0.035) 0, transparent 45%),\n      radial-gradient(circle at 85% 80%, rgba(0,0,0,0.035) 0, transparent 45%);\n    font-family:var(--font-body);\n    color:var(--ink);\n    min-height:100vh;\n    display:flex;\n    align-items:flex-start;\n    justify-content:center;\n    padding:36px 16px 60px;\n    -webkit-font-smoothing:antialiased;\n  }\n  #stage{ width:100%; max-width:440px; }\n  .stack-wrap{ position:relative; }\n\n  .kicker{\n    text-align:center;\n    font-weight:700;\n    font-size:13px;\n    letter-spacing:0.02em;\n    color:#8b8578;\n    margin:0 0 18px;\n  }\n  .kicker b{color:var(--ink);}\n\n  .card{\n    position:relative;\n    border-radius:30px;\n    padding:24px 24px 24px;\n    min-height:420px;\n    display:flex;\n    flex-direction:column;\n    box-shadow:0 18px 40px -14px rgba(0,0,0,0.35), 0 2px 0 rgba(0,0,0,0.06);\n    transform:rotate(-1deg);\n    transition:transform 0.4s cubic-bezier(.2,.8,.2,1);\n    color:var(--white);\n    overflow:visible;\n  }\n  .card.tilt-r{ transform:rotate(1deg); }\n  .card.flat{ transform:rotate(0deg); }\n\n  .card-top{\n    display:flex;\n    flex-direction:column;\n    gap:12px;\n    font-weight:800;\n    font-size:12.5px;\n    letter-spacing:0.02em;\n    margin-bottom:22px;\n    opacity:0.95;\n  }\n  .card-top-row{\n    display:flex;\n    justify-content:space-between;\n    align-items:center;\n    gap:10px;\n  }\n  .card-top .brand{\n    font-family:var(--font-display);\n    font-size:14px;\n    letter-spacing:-0.01em;\n    flex-shrink:0;\n  }\n  .stepper{\n    display:flex;\n    align-items:center;\n    flex-wrap:wrap;\n    gap:6px 10px;\n    max-width:100%;\n  }\n  .step{\n    display:flex;\n    align-items:center;\n    gap:3px;\n    font-size:10.5px;\n    font-weight:800;\n    letter-spacing:0.02em;\n    opacity:0.5;\n    flex-shrink:0;\n  }\n  .step.done{ opacity:1; }\n  .step.now{ opacity:1; }\n  .step .glyph{\n    width:13px; height:13px;\n    display:inline-flex;\n    align-items:center;\n    justify-content:center;\n    flex-shrink:0;\n  }\n  .step .glyph svg{ width:100%; height:100%; }\n  .step-more{\n    font-size:10.5px;\n    font-weight:800;\n    opacity:0.5;\n    flex-shrink:0;\n  }\n  .edition{ font-weight:800; font-size:12px; opacity:0.9; white-space:nowrap; flex-shrink:0; }\n\n  /* ---------- QUESTION CARD ---------- */\n  .q-text{\n    font-family:var(--font-display);\n    font-size:26px;\n    line-height:1.22;\n    margin:0 0 auto;\n    letter-spacing:-0.01em;\n    position:relative;\n    z-index:1;\n  }\n\n  .polaroid{\n    position:absolute;\n    top:56px;\n    right:-6px;\n    width:118px;\n    background:var(--white);\n    padding:7px 7px 22px;\n    border-radius:3px;\n    box-shadow:0 10px 22px -8px rgba(0,0,0,0.45);\n    transform:rotate(6deg);\n    z-index:2;\n  }\n  .polaroid img{\n    width:100%;\n    height:90px;\n    object-fit:cover;\n    display:block;\n    border-radius:1px;\n  }\n  .polaroid .cap{\n    position:absolute;\n    bottom:6px;\n    left:0; right:0;\n    text-align:center;\n    font-size:8px;\n    font-weight:800;\n    letter-spacing:0.05em;\n    color:#8b8578;\n  }\n\n  .guess-field{\n    position:relative;\n    margin-top:24px;\n    background:rgba(255,255,255,0.22);\n    border-radius:18px;\n    padding:16px 18px;\n    display:flex;\n    align-items:center;\n    justify-content:space-between;\n    gap:10px;\n  }\n  .guess-field input{\n    flex:1;\n    min-width:0;\n    background:transparent;\n    border:none;\n    color:var(--white);\n    font-family:var(--font-display);\n    font-size:20px;\n    outline:none;\n    -moz-appearance:textfield;\n  }\n  .guess-field input::-webkit-outer-spin-button,\n  .guess-field input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }\n  .guess-field input::placeholder{ color:rgba(255,255,255,0.65); font-family:var(--font-body); font-weight:600; font-size:16px; letter-spacing:0.01em; }\n  .guess-unit{\n    font-weight:800;\n    font-size:11px;\n    letter-spacing:0.06em;\n    text-transform:uppercase;\n    color:rgba(255,255,255,0.85);\n    white-space:nowrap;\n    flex-shrink:0;\n  }\n  .field-error{\n    font-weight:600;\n    font-size:12.5px;\n    color:#fff3ea;\n    background:rgba(0,0,0,0.18);\n    border-radius:8px;\n    padding:6px 10px;\n    margin-top:10px;\n    display:none;\n  }\n  .field-error.show{ display:inline-block; }\n\n  .card-bottom-row{\n    display:flex;\n    align-items:center;\n    justify-content:space-between;\n    margin-top:20px;\n    gap:12px;\n  }\n  .icon-btn{\n    width:44px; height:44px;\n    border-radius:50%;\n    border:1.5px solid rgba(255,255,255,0.5);\n    background:transparent;\n    color:var(--white);\n    display:flex; align-items:center; justify-content:center;\n    cursor:pointer;\n    flex-shrink:0;\n    transition:background 0.12s ease, transform 0.08s ease;\n  }\n  .icon-btn:hover{ background:rgba(255,255,255,0.14); }\n  .icon-btn:active{ transform:scale(0.94); }\n  .icon-btn svg{ width:19px; height:19px; }\n\n  /* ---------- CALCULATOR MODAL ---------- */\n  .calc-overlay{\n    position:fixed; inset:0;\n    background:rgba(20,18,14,0.45);\n    display:flex;\n    align-items:center;\n    justify-content:center;\n    z-index:1000;\n    padding:20px;\n    opacity:0;\n    pointer-events:none;\n    transition:opacity 0.18s ease;\n  }\n  .calc-overlay.open{ opacity:1; pointer-events:auto; }\n  .calc-modal{\n    background:var(--white);\n    border-radius:22px;\n    display:flex;\n    max-width:520px;\n    width:100%;\n    box-shadow:0 30px 60px -20px rgba(0,0,0,0.45);\n    overflow:hidden;\n    transform:translateY(14px) scale(0.97);\n    transition:transform 0.18s cubic-bezier(.2,.8,.2,1);\n  }\n  .calc-overlay.open .calc-modal{ transform:translateY(0) scale(1); }\n\n  .scratch-pane{\n    flex:1;\n    min-width:0;\n    padding:22px 18px;\n    border-right:1px solid #ece7dc;\n    display:flex;\n    flex-direction:column;\n  }\n  .scratch-head{\n    display:flex;\n    align-items:center;\n    justify-content:space-between;\n    margin-bottom:14px;\n  }\n  .scratch-head .st{\n    font-weight:800;\n    font-size:11px;\n    letter-spacing:0.09em;\n    text-transform:uppercase;\n    color:#8b8578;\n  }\n  .scratch-clear{\n    width:26px; height:26px;\n    border-radius:8px;\n    border:none;\n    background:transparent;\n    color:#a39c8a;\n    display:flex; align-items:center; justify-content:center;\n    cursor:pointer;\n  }\n  .scratch-clear:hover{ background:#f0ece1; color:var(--ink); }\n  .scratch-clear svg{ width:15px; height:15px; }\n  .scratch-textarea{\n    flex:1;\n    resize:none;\n    border:none;\n    outline:none;\n    background:\n      repeating-linear-gradient(to bottom, transparent, transparent 30px, #ece7dc 31px);\n    line-height:31px;\n    font-family:var(--font-body);\n    font-size:13.5px;\n    color:var(--ink);\n    padding:0;\n    min-height:280px;\n  }\n  .scratch-textarea::placeholder{ color:#b5ac97; }\n\n  .calc-pane{\n    flex:1;\n    min-width:0;\n    padding:22px 18px;\n    display:flex;\n    flex-direction:column;\n    gap:10px;\n  }\n  .calc-displ on:absolute;\n    top:0; bottom:0;\n    width:0;\n    border-left:1.5px dashed rgba(255,255,255,0.85);\n  }\n  .you-flag{\n    position:absolute;\n    bottom:100%;\n    left:50%;\n    transform:translateX(-50%);\n    background:#F5C531;\n    color:#4a3900;\n    font-weight:800;\n    font-size:9.5px;\n    letter-spacing:0.02em;\n    padding:2px 6px;\n    border-radius:5px;\n    margin-bottom:4px;\n    white-space:nowrap;\n  }\n  .hist-scale{ display:flex; justify-content:space-between; font-weight:700; font-size:10px; opacity:0.65; margin-top:6px; }\n\n  .accordion{\n    border-radius:14px;\n    background:rgba(255,255,255,0.14);\n    overflow:hidden;\n    margin-bottom:18px;\n  }\n  .accordion-head{\n    display:flex;\n    align-items:center;\n    justify-content:space-between;\n    padding:13px 16px;\n    cursor:pointer;\n    font-weight:800;\n    font-size:11.5px;\n    letter-spacing:0.06em;\n    text-transform:uppercase;\n  }\n  .accordion-head .chev{ transition:transform 0.2s ease; font-size:12px; }\n  .accordion.open .accordion-head .chev{ transform:rotate(180deg); }\n  .accordion-body{\n    max-height:0;\n    overflow:hidden;\n    transition:max-height 0.25s ease;\n  }\n  .accordion.open .accordion-body{ max-height:220px; }\n  .accordion-body-inner{\n    padding:0 16px 15px;\n    font-weight:500;\n    font-size:12.5px;\n    line-height:1.55;\n    opacity:0.92;\n  }\n\n  .dots{ display:flex; justify-content:center; gap:7px; margin-top:auto; padding-top:16px; }\n  .dot{ width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,0.35); }\n  .dot.on{ background:#fff; width:20px; border-radius:5px; }\n\n  /* ---------- SUMMARY CARD ---------- */\n  .card.s-card{ background:linear-gradient(165deg, #F5C531 0%, #DDAE18 130%); color:var(--ink); }\n  .s-card .card-top{ color:var(--ink); opacity:0.8; }\n  .s-eyebrow{ font-weight:800; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; opacity:0.65; margin-bottom:6px; }\n  .s-score{ font-family:var Standard 20lb copy paper reams weigh roughly 2.2-2.5 kg.\"},\n{cat:\"Everyday\", q:\"How many grains of sand are on an average few-kilometer stretch of beach?\", unit:\"grains\", answer:1e17, min:1e6, max:1e30, source:\"Estimates for a modest beach commonly land in the range of 10^16-10^18 grains.\"},\n{cat:\"Everyday\", q:\"How many keys are on a standard piano?\", unit:\"keys\", answer:88, min:1, max:10000, source:\"A standard piano has 88 keys.\"},\n{cat:\"Everyday\", q:\"How many times can a standard sheet of paper practically be folded in half?\", unit:\"folds\", answer:7, min:1, max:1000, source:\"With ordinary paper, about 7-8 folds is the practical real-world limit before it gets too thick.\"},\n{cat:\"Everyday\", q:\"How many gallons of water does a standard washing machine use per load?\", unit:\"gallons\", answer:20, min:0.01, max:100000, source:\"Modern efficient washing machines use roughly 15-30 gallons per load.\"},\n{cat:\"Everyday\", q:\"How many LEGO bricks have been produced since the company's founding?\", unit:\"bricks\", answer:8.3e11, min:1e6, max:1e15, source:\"LEGO has reported producing well over 800 billion bricks in total.\"},\n{cat:\"Everyday\", q:\"How many bricks or stones were used to build the Great Wall of China?\", unit:\"bricks\", answer:3.87e9, min:1e3, max:1e13, source:\"Estimates for total bricks and stones used run into the billions.\"},\n{cat:\"Everyday\", q:\"Roughly how many characters are in the complete works of Shakespeare?\", unit:\"characters\", answer:5e6, min:1e3, max:1e10, source:\"The complete works run to roughly 900,000 words, or several million characters.\"},\n{cat:\"Everyday\", q:\"How many staples are typically in a standard office stapler strip?\", unit:\"staples\", answer:210, min:1, max:1e6, source:\"A standard strip of staples usually holds around 210 staples.\"},\n{cat:\"Everyday\", q:\"How many pixels are in a 4K television screen?\", unit:\"pixels\", answer:8.3e6, min:1e3, max:1e12, source:\"A 4K display, 3840\u00d72160, has about 8.3 million pixels.\"},\n{cat:\"Everyday\", q:\"What is the thickness of a human hair, in micrometers?\", unit:\"\u00b5m\", answer:75, min:0.01, max:100000, source:\"Human hair diameter typically runs 50-100 micrometers.\"},\n\n{cat:\"Transport\", q:\"How many commercial flights take off worldwide each day?\", unit:\"flights\", answer:100000, min:1, max:1e9, source:\"Roughly 100,000 commercial flights operate globally each day.\"},\n{cat:\"Transport\", q:\"How many cars are there in the world?\", unit:\"cars\", answer:1.5e9, min:1e3, max:1e12, source:\"The global car fleet is estimated at around 1.4-1.5 billion vehicles.\"},\n{cat:\"Transport\", q:\"How many miles of paved road exist in the United States?\", unit:\"miles\", answer:2.8e6, min:1e3, max:1e10, source:\"The US has roughly 2.8 million miles of paved public roads.\"},\n{cat:\"Transport\", q:\"How many passengers does the New York City subway carry per day?\", unit:\"passengers\", answer:3.6e6, min:1e3, max:1e10, source:\"NYC subway ridership typically runs several million riders per weekday.\"},\n{cat:\"Transport\", q:\"How fast does a commercial jet typically cruise, in miles per hour?\", unit:\"mph\", answer:560, min:1, max:100000, source:\"Commercial jets typically cruise around 550-580 mph.\"},\n{cat:\"Transport\", q:\"How many shipping containers pass through the world's busiest port each year, measured in TEU?\", unit:\"TEU\", answer:4.7e7, min:1e3, max:1e10, source:\"The busiest ports, like Shanghai, handle around 45-50 million TEU annually.\"},\n{cat:\"Transport\", q:\"How many bicycles are there in the world?\", unit:\"bicycles\", answer:2e9, min:1e3, max:1e12, source:\"Global bicycle estimates commonly land around 2 billion.\"},\n{cat:\"Transport\", q:\"How many miles does the average American drive per year?\", unit:\"miles\", answer:13500, min:1, max:1e7, source:\"US drivers average roughly 13,000-14,000 miles a year.\"},\n\n{cat:\"Fun estimates\", q:\"How many licks does it take to get to the center of a Tootsie Pop, per the famous engineering study?\", unit:\"licks\", answer:364, min:1, max:100000, source:\"A widely cited Purdue study found a mechanical licking machine averaged 364 licks.\"},\n{cat:\"Fun estimates\", q:\"How many piano tuners are there in Chicago \u2014 Fermi's own classic question?\", unit:\"piano tuners\", answer:125, min:1, max:1e6, source:\"Fermi's back-of-envelope estimate landed around 100-150 tuners; actual figures have varied by era.\"},\n{cat:\"Fun estimates\", q:\"How many golf balls would fit inside a school bus?\", unit:\"golf balls\", answer:500000, min:1, max:1e9, source:\"Bus volume divided by golf ball volume, with packing loss, gives roughly half a million.\"},\n{cat:\"Fun estimates\", q:\"How many riffle shuffles does it take to fully randomize a deck of cards?\", unit:\"shuffles\", answer:7, min:1, max:10000, source:\"A well-known result from Bayer and Diaconis found 7 riffle shuffles sufficiently randomizes a deck.\"},\n{cat:\"Fun estimates\", q:\"What's the competitive-eating record for hot dogs eaten in 10 minutes?\", unit:\"hot dogs\", answer:76, min:1, max:100000, source:\"The competitive eating world record sits around 76 hot dogs and buns in 10 minutes.\"},\n{cat:\"Fun estimates\", q:\"How many ping pong balls would it take to fill a standard school gymnasium?\", unit:\"ping pong balls\", answer:5e7, min:1e3, max:1e12, source:\"A large gym's volume divided by ping-pong-ball volume, with packing, gives tens of millions.\"},\n{cat:\"Fun estimates\", q:\"How many jelly beans fit in a standard 1-gallon jar?\", unit:\"jelly beans\", answer:2500, min:1, max:1e7, source:\"A common rule of thumb for jelly-bean-guessing contests is roughly 2,500 per gallon.\"},\n\n{cat:\"Energy\", q:\"How many kWh does the average US household use per year?\", unit:\"kWh\", answer:10800, min:1, max:1e9, source:\"US EIA data puts average household electricity use around 10,500-11,000 kWh a year.\"},\n{cat:\"Energy\", q:\"How many kilograms of CO2 does one passenger generate on a round-trip transatlantic flight?\", unit:\"kg CO2\", answer:1600, min:1, max:1e7, source:\"A round-trip transatlantic economy flight is often estimated near 1-2 tons of CO2 per passenger.\"},\n{cat:\"Energy\", q:\"What percentage of global electricity currently comes from renewable sources?\", unit:\"percent\", answer:30, min:0.01, max:100, source:\"Renewables such as hydro, wind, and solar supply roughly 30% of global electricity generation.\"},\n{cat:\"Energy\", q:\"How many barrels of oil does the world consume per day?\", unit:\"barrels\", answer:1.02e8, min:1e3, max:1e12, source:\"Global oil consumption runs around 100-103 million barrels a day.\"},\n{cat:\"Energy\", q:\"How many nuclear power plants are currently operating worldwide?\", unit:\"reactors\", answer:440, min:1, max:1e6, source:\"There are roughly 440 operable nuclear reactors worldwide.\"},\n{cat:\"Energy\", q:\"How many watt-hours does it take to fully charge a smartphone?\", unit:\"Wh\", answer:12, min:0.01, max:1e6, source:\"A typical smartphone battery holds around 10-15 Wh.\"},\n\n{cat:\"Sports\", q:\"How many people watched the most recent FIFA World Cup final worldwide?\", unit:\"viewers\", answer:1.5e9, min:1e3, max:1e10, source:\"World Cup finals commonly draw well over a billion viewers globally across broadcasts.\"},\n{cat:\"Sports\", q:\"What was Usain Bolt's peak speed during his 100m world record, in miles per hour?\", unit:\"mph\", answer:27.8, min:0.1, max:100000, source:\"Bolt's peak speed during his 100m world record was measured around 27.8 mph.\"},\n{cat:\"Sports\", q:\"How many calories does a marathon runner burn during a race?\", unit:\"kcal\", answer:2600, min:1, max:1000000, source:\"A typical marathon burns roughly 2,600-3,000 calories depending on body weight and pace.\"},\n{cat:\"Sports\", q:\"How many golf balls are lost or discarded in the US each year?\", unit:\"golf balls\", answer:3e8, min:1e3, max:1e12, source:\"Estimates suggest hundreds of millions of golf balls are lost annually in the US alone.\"},\n{cat:\"Sports\", q:\"How many people play soccer worldwide, at any level?\", unit:\"players\", answer:2.65e8, min:1e3, max:1e10, source:\"FIFA has estimated around 265 million people play football worldwide.\"},\n\n{cat:\"Science\", q:\"How many atoms are in a single grain of sand?\", unit:\"atoms\", answer:2e19, min:1e6, max:1e30, source:\"A typical sand grain, mostly silica, contains on the order of 10^19 atoms.\"},\n{cat:\"Science\", q:\"What is Avogadro's number \u2014 atoms or molecules per mole?\", unit:\"per mole\", answer:6.022e23, min:1e10, max:1e30, source:\"Avogadro's number is exactly 6.02214076\u00d710^23 by the modern SI definition.\"},\n{cat:\"Science\", q:\"How many elements are on the periodic table?\", unit:\"elements\", answer:118, min:1, max:100000, source:\"The periodic table currently has 118 confirmed elements.\"},\n{cat:\"Science\", q:\"What is the speed of sound in air at sea level, in meters per second?\", unit:\"m/s\", answer:343, min:0.1, max:1e6, source:\"Sound travels at about 343 m/s in dry air at 20\u00b0C.\"},\n{cat:\"Science\", q:\"How many base pairs are in the human genome?\", unit:\"base pairs\", answer:3.1e9, min:1e3, max:1e15, source:\"The human genome contains roughly 3.1 billion base pairs.\"},\n{cat:\"Science\", q:\"How hot is the Earth's core, in Celsius?\", unit:\"\u00b0C\", answer:5500, min:1, max:1e7, source:\"Earth's inner core is estimated at about 5,200-5,700\u00b0C, similar to the Sun's surface.\"},\n\n{cat:\"Culture\", q:\"How many songs are available on major streaming services like Spotify?\", unit:\"songs\", answer:1e8, min:1e3, max:1e12, source:\"Major streaming catalogs have surpassed 100 million tracks.\"},\n{cat:\"Culture\", q:\"How many feature films are released theatrically worldwide each year?\", unit:\"movies\", answer:8000, min:1, max:1e7, source:\"Thousands of feature films are released globally each year across all markets.\"},\n{cat:\"Culture\", q:\"How many books are published worldwide each year, including self-published titles?\", unit:\"books\", answer:2.2e6, min:1e3, max:1e10, source:\"Global book publishing is estimated at over 2 million titles a year.\"},\n{cat:\"Culture\", q:\"How many monthly active users does the largest social media platform have?\", unit:\"users\", answer:3.3e9, min:1e3, max:1e12, source:\"The largest platforms, like Facebook, report monthly active users above 3 billion.\"},\n{cat:\"Culture\", q:\"Roughly how many words are in the English language, counting all dictionary and technical entries?\", unit:\"words\", answer:1e6, min:1e3, max:1e10, source:\"Comprehensive counts including technical and scientific terms put English near a million words.\"},\n{cat:\"Culture\", q:\"How many people play video games worldwide, including mobile?\", unit:\"players\", answer:3.3e9, min:1e3, max:1e10, source:\"Global gamer counts are estimated at over 3 billion people.\"},\n];\n\n/* =========================================================\n   Deterministic \"how everyone guessed\" distribution\n   ========================================================= */\nfunction mulberry32(seed){\n  return function(){\n    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;\n    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);\n    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;\n    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n  };\n}\nfunction hashStr(s){ let h=0; for(let i=0;i<s.length;i++){ h=Math.imul(31,h)+s.charCodeAt(i)|0; } return h; }\nfunction buildHistogram(question, numBars){\n  const rand = mulberry32(hashStr(question.q));\n  const bars = new Array(numBars).fill(0);\n  const centerBar = Math.floor(numBars*0.42) + Math.floor(rand()*3);\n  const N = 900;\n  for (let i=0;i<N;i++){\n    let u=0,v=0;\n    while(u===0) u=rand();\n    while(v===0) v=rand();\n    const g = Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);\n    let idx = Math.round(centerBar + g*(numBars*0.13));\n    idx = Math.max(0, Math.min(numBars-1, idx));\n    bars[idx]++;\n  }\n  const max = Math.max(...bars);\n  return {bars: bars.map(b=>b/max), centerBar, numBars};\n}\n\n/* =========================================================\n   Helpers\n   ========================================================= */\nfunction log10(x){ return Math.log(x)/Math.LN10; }\nfunction fmtCompact(n){\n  if (n===0) return \"0\";\n  const abs = Math.abs(n);\n  if (abs < 0.01) return n.toExponential(2);\n  if (abs < 1000) return Number.isInteger(n) ? n.toString() : parseFloat(n.toFixed(2)).toString();\n  const units = [{v:1e12,s:\"T\"},{v:1e9,s:\"B\"},{v:1e6,s:\"M\"},{v:1e3,s:\"K\"}];\n  for (const u of units){ if (abs>=u.v) return (n/u.v).toFixed(n/u.v>=100?0:1).replace(/\\.0$/,'')+u.s; }\n  return Math.round(n).toString();\n}\nfunction fmtFull(n){\n  if (n===0) return \"0\";\n  const abs = Math.abs(n);\n  if (abs < 0.001 || abs >= 1e15) return n.toExponential(2);\n  if (abs < 1) return parseFloat(n.toFixed(4)).toString();\n  if (abs < 1000) return parseFloat(n.toFixed(2)).toString();\n  return Math.round(n).toLocaleString();\n}\nfunction multiplierOf(guess, answer){ return guess>=answer ? guess/answer : answer/guess; }\n\n/* =========================================================\n   State\n   ========================================================= */\nconst ALL_CATS = [...new Set(QUESTIONS.map(q=>q.cat))];\nconst state = {\n  screen:\"setup\",\n  selectedCats:new Set(),\n  roundLength:10,\n  pool:[],\n  idx:0,\n  history:[],\n  editionNo: Math.floor(Math.random()*900+100),\n  accordionOpen:false,\n};\n\nfunction shuffledCopy(arr){\n  const a = arr.slice();\n  for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }\n  return a;\n}\nfunction startGame(){\n  let pool = QUESTIONS.slice();\n  if (state.selectedCats.size>0) pool = pool.filter(q=>state.selectedCats.has(q.cat));\n  pool = shuffledCopy(pool).slice(0, Math.min(state.roundLength, pool.length));\n  state.pool = pool;\n  state.idx = 0;\n  state.history = [];\n  state.accordionOpen = false;\n  state.screen = \"question\";\n  render();\n}\nfunction currentQ(){ return state.pool[state.idx]; }\n\n/* =========================================================\n   SCRATCH-PAD CALCULATOR\n   Self-contained: running value + pending operator, chained\n   the way a physical calculator works (press an op to commit\n   the previous one, = to resolve, C to reset).\n   ========================================================= */\nconst calcState = {\n  display: \"0\",\n  stored: null,\n  pendingOp: null,\n  overwrite: true,\n  notes: \"\",\n};\n\nfunction calcFormat(n){\n  if (!isFinite(n)) return \"Error\";\n  if (Math.abs(n) < 1e-9) n = 0;\n  const rounded = Math.round(n * 1e10) / 1e10;\n  let s = rounded.toString();\n  if (s.length > 14){\n    s = rounded.toExponential(6);\n  }\n  return s;\n}\n\nfunction calcApply(a, b, op){\n  switch(op){\n    case '+': return a + b;\n    case '-': return a - b;\n    case '\u00d7': return a * b;\n    case '\u00f7': return b === 0 ? NaN : a / b;\n    default: return b;\n  }\n}\n\nfunction calcPressDigit(d){\n  if (calcState.overwrite){\n    calcState.display = (d === '.') ? \"0.\" : d;\n    calcState.overwrite = false;\n  } else {\n    if (d === '.' && calcState.display.includes('.')) return;\n    if (calcState.display === \"0\" && d !== '.') calcState.display = d;\n    else calcState.display += d;\n  }\n}\n\nfunction calcPressOp(op){\n  const current = parseFloat(calcState.display);\n  if (calcState.stored !== null && calcState.pendingOp && !calcState.overwrite){\n    calcState.stored = calcApply(calcState.stored, current, calcState.pendingOp);\n    calcState.display = calcFormat(calcState.stored);\n  } else {\n    calcState.stored = current;\n  }\n  calcState.pendingOp = op;\n  calcState.overwrite = true;\n}\n\nfunction calcPressEquals(){\n  const current = parseFloat(calcState.display);\n  if (calcState.stored !== null && calcState.pendingOp){\n    const result = calcApply(calcState.stored, current, calcState.pendingOp);\n    calcState.display = calcFormat(result);\n    calcState.stored = null;\n    calcState.pendingOp = null;\n    calcState.overwrite = true;\n  }\n}\n\nfunction calcPressPercent(){\n  const current = parseFloat(calcState.display);\n  let result;\n  if (calcState.stored !== null && calcState.pendingOp){\n    result = calcState.stored * (current/100);\n  } else {\n    result = current / 100;\n  }\n  calcState.display = calcFormat(result);\n  calcState.overwrite = true;\n}\n\nfunction calcPressPi(){\n  calcState.display = calcFormat(Math.PI);\n  calcState.overwrite = true;\n}\n\nfunction calcPressSign(){\n  const current = parseFloat(calcState.display);\n  calcState.display = calcFormat(current * -1);\n}\n\nfunction calcClear(){\n  calcState.display = \"0\";\n  calcState.stored = null;\n  calcState.pendingOp = null;\n  calcState.overwrite = true;\n}\n\nfunction updateCalcDisplay(){\n  const el = document.getElementById('calc-display-val');\n  if (el) el.textContent = calcState.display;\n}\n\nlet calcModalOpen = false;\n\nfunction openCalcModal(){\n  calcModalOpen = true;\n  renderCalcModal();\n  requestAnimationFrame(()=>{\n    document.getElementById('calc-overlay').classList.add('open');\n  });\n}\nfunction closeCalcModal(){\n  const ov = document.getElementById('calc-overlay');\n  if (ov){\n    ov.classList.remove('open');\n    setTimeout(()=>{ calcModalOpen = false; ov.remove(); }, 180);\n  }\n}\n\nfunction renderCalcModal(){\n  const existing = document.getElementById('calc-overlay');\n  if (existing) existing.remove();\n\n  const trashIcon = `<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13\"/><\/svg>`;\n\n  const overlay = document.createElement('div');\n  overlay.id = 'calc-overlay';\n  overlay.className = 'calc-overlay';\n  overlay.innerHTML = `\n    <div class=\"calc-modal\">\n      <div class=\"scratch-pane\">\n        <div class=\"scratch-head\">\n          <span class=\"st\">Scratch pad<\/span>\n          <button class=\"scratch-clear\" id=\"scratch-clear-btn\" title=\"Clear notes\">${trashIcon}<\/button>\n        <\/div>\n        <textarea class=\"scratch-textarea\" id=\"scratch-textarea\" placeholder=\"Jot notes, work things out...\">${calcState.notes}<\/textarea>\n      <\/div>\n      <div class=\"calc-pane\">\n        <div class=\"calc-display\"><span id=\"calc-display-val\">${calcState.display}<\/span><\/div>\n        <div class=\"calc-grid\">\n          <button class=\"calc-key op-clear\" data-action=\"clear\">C<\/button>\n          <button class=\"calc-key\" data-action=\"sign\">\u00b1<\/button>\n          <button class=\"calc-key\" data-action=\"percent\">%<\/button>\n          <button class=\"calc-key op-div\" data-action=\"op\" data-op=\"\u00f7\">\u00f7<\/button>\n\n          <button class=\"calc-key\" data-action=\"digit\" data-digit=\"7\">7<\/button>\n          <button class=\"calc-key\" data-action=\"digit\" data-digit=\"8\">8<\/button>\n          <button class=\"calc-key\" data-action=\"digit\" data-digit=\"9\">9<\/button>\n          <button class=\"calc-key op-mul\" data-action=\"op\" data-op=\"\u00d7\">\u00d7<\/button>\n\n          <button class=\"calc-key\" data-action=\"digit\" data-digit=\"4\">4<\/button>\n          <button class=\"calc-key\" data-action=\"digit\" data-digit=\"5\">5<\/button>\n          <button class=\"calc-key\" data-action=\"digit\" data-digit=\"6\">6<\/button>\n          <button class=\"calc-key op-sub\" data-action=\"op\" data-op=\"-\">&minus;<\/button>\n\n          <button class=\"calc-key\" data-action=\"digit\" data-digit=\"1\">1<\/button>\n          <button class=\"calc-key\" data-action=\"digit\" data-digit=\"2\">2<\/button>\n          <button class=\"calc-key\" data-action=\"digit\" data-digit=\"3\">3<\/button>\n          <button class=\"calc-key op-add\" data-action=\"op\" data-op=\"+\">+<\/button>\n\n          <button class=\"calc-key\" data-action=\"pi\">&pi;<\/button>\n          <button class=\"calc-key\" data-action=\"digit\" data-digit=\"0\">0<\/button>\n          <button class=\"calc-key\" data-action=\"digit\" data-digit=\".\">.<\/button>\n          <button class=\"calc-key op-eq\" data-action=\"equals\">=<\/button>\n        <\/div>\n      <\/div>\n    <\/div>\n  `;\n  document.body.appendChild(overlay);\n\n  overlay.addEventListener('mousedown', (e)=>{\n    if (e.target === overlay) closeCalcModal();\n  });\n\n  overlay.querySelectorAll('.calc-key').forEach(btn=>{\n    btn.addEventListener('click', ()=>{\n      const action = btn.dataset.action;\n      if (action === 'digit') calcPressDigit(btn.dataset.digit);\n      else if (action === 'op') calcPressOp(btn.dataset.op);\n      else if (action === 'equals') calcPressEquals();\n      else if (action === 'percent') calcPressPercent();\n      else if (action === 'pi') calcPressPi();\n      else if (action === 'sign') calcPressSign();\n      else if (action === 'clear') calcClear();\n      updateCalcDisplay();\n    });\n  });\n\n  const textarea = document.getElementById('scratch-textarea');\n  textarea.addEventListener('input', ()=>{ calcState.notes = textarea.value; });\n  document.getElementById('scratch-clear-btn').addEventListener('click', ()=>{\n    calcState.notes = \"\";\n    textarea.value = \"\";\n    textarea.focus();\n  });\n\n  // keyboard support while modal is open\n  function keyHandler(e){\n    if (!calcModalOpen) { document.removeEventListener('keydown', keyHandler); return; }\n    if (document.activeElement === textarea) {\n      if (e.key === 'Escape') closeCalcModal();\n      return;\n    }\n    if (e.key >= '0' && e.key <= '9') calcPressDigit(e.key);\n    else if (e.key === '.') calcPressDigit('.');\n    else if (e.key === '+') calcPressOp('+');\n    else if (e.key === '-') calcPressOp('- losest('.chip'); if(!chip) return;\n    const c = chip.dataset.cat;\n    if (state.selectedCats.has(c)) state.selectedCats.delete(c); else state.selectedCats.add(c);\n    render();\n  });\n  document.getElementById('len-picker').addEventListener('click', e=>{\n    const chip = e.target.closest('.chip'); if(!chip) return;\n    state.roundLength = parseInt(chip.dataset.len,10);\n    render();\n  });\n  document.getElementById('start-btn').addEventListener('click', startGame);\n}\n\nfunction renderQuestion(){\n  const q = currentQ();\n  const pal = paletteFor(state.idx);\n  const dots = state.pool.map((_,i)=>`<div class=\"dot${i===state.idx?' on':''}\"><\/div>`).join('');\n\n  stage.innerHTML = `\n    <div class=\"kicker\">Q${state.idx+1} / ${state.pool.length} &middot; <b>${q.cat}<\/b><\/div>\n    <div class=\"stack-wrap\">\n      <div class=\"card ${tiltFor(state.idx)}\" style=\"background:linear-gradient(165deg, ${pal.base} 0%, ${pal.deep} 130%);\">\n        <div class=\"card-top\">\n          <div class=\"card-top-row\">\n            <span class=\"brand\">Fermi.gg<\/span>\n            <span class=\"edition\">No. ${String(state.editionNo).padStart(3,'0')}<\/span>\n          <\/div>\n          <div class=\"stepper\">${stepperHTML(state.idx)}<\/div>\n        <\/div>\n        <p class=\"q-text\">${q.q}<\/p>\n        <div class=\"guess-field\">\n          <input type=\"number\" inputmode=\"decimal\" id=\"guess-input\" placeholder=\"your guess\" autocomplete=\"off\">\n          <span class=\"guess-unit\">${q.unit}<\/span>\n        <\/div>\n        <div class=\"field-error\" id=\"field-error\">Enter a number first.<\/div>\n        <div class=\"card-bottom-row\">\n          <button class=\"icon-btn\" id=\"calc-open-btn\" type=\"button\" title=\"Open scratch pad\">${CALC_ICON}<\/button>\n          <button class=\"pill-btn\" id=\"lock-btn\">Lock it in &rarr;<\/button>\n        <\/div>\n        <div class=\"dots\">${dots}<\/div>\n      <\/div>\n    <\/div>\n  `;\n\n  const input = document.getElementById('guess-input');\n  const err = document.getElementById('field-error');\n  input.addEventListener('input', ()=> err.classList.remove('show'));\n  input.focus();\n\n  function submit(){\n    const raw = input.value.trim();\n    const val = parseFloat(raw);\n    if (raw===\"\" || isNaN(val) || val<=0){ err.classList.add('show'); return; }\n    const a = q.answer;\n    const err_oom = Math.abs(log10(val)-log10(a));\n    const mult = multiplierOf(val, a);\n    state.history.push({ q:q.q, unit:q.unit, guess:val, answer:a, mult, err_oom, source:q.source, cat:q.cat, paletteIdx: state.idx % PALETTE.length });\n    state.accordionOpen = false;\n    state.screen = \"result\";\n    render();\n  }\n  document.getElementById('lock-btn').addEventListener('click', submit);\n  document.getElementById('calc-open-btn').addEventListener('click', (e)=>{\n    e.preventDefault();\n    openCalcModal();\n  });\n  input.addEventListener('keydown', e=>{ if (e.key==='Enter') submit(); });\n}\n\nfunction verdictText(h){\n  const dir = h.guess < h.answer ? \"Too low\" : (h.guess > h.answer ? \"Too high\" : \"Exact\");\n  const mult = h.mult;\n  let closeness;\n  if (mult <= 1.15) closeness = \"Bullseye\";\n  else if (mult <= 2) closeness = \"Very close\";\n  else if (mult <= 5) closeness = \"In the ballpark\";\n  else if (mult <= 20) closeness = \"Off by a bit\";\n  else closeness = \"Off by a mile\";\n  return {dir, closeness};\n}\n\nfunction renderResult(){\n  const h = state.history[state.history.length-1];\n  const q = currentQ();\n  const pal = PALETTE[h.paletteIdx];\n  const v = verdictText(h);\n  const hist = buildHistogram(q, 14);\n\n  const guessLog = log10(h.guess);\n  const answerLog = log10(h.answer);\n  const rangeLo = log10(q.min), rangeHi = log10(q.max);\n  let guessBar = Math.round(((guessLog-rangeLo)/(rangeHi-rangeLo)) * (hist.numBars-1));\n  guessBar = Math.max(0, Math.min(hist.numBars-1, guessBar));\n  const truthPct = Math.max(0, Math.min(100, ((answerLog-rangeLo)/(rangeHi-rangeLo))*100));\n\n  const bars = hist.bars.map((hb,i)=>{\n    const isYou = i===guessBar;\n    const heightPct = Math.max(6, hb*100);\n    return `<div class=\"bar${isYou?' you':''}\" style=\"height:${heightPct}%;\">${isYou?`<div class=\"you-flag\">You<\/div>`:''}<\/div>`;\n  }).join('');\n\n  const multStr = h.mult.toFixed(2).replace(/\\.00$/,'') + '\u00d7';\n\n  stage.innerHTML = `\n    <div class=\"kicker\">Q${state.idx+1} / ${state.pool.length} &middot; <b>${q.cat}<\/b><\/div>\n    <div class=\"stack-wrap\">\n      <div class=\"card ${tiltFor(state.idx)}\" style=\"background:linear-gradient(165deg, ${pal.base} 0%, ${pal.deep} 130%);\">\n        <div class=\"card-top\">\n          <div class=\"card-top-row\">\n            <span class=\"brand\">Fermi.gg<\/span>\n            <span class=\"edition\">No. ${String(state.editionNo).padStart(3,'0')}<\/span>\n          <\/div>\n          <div class=\"stepper\">${stepperHTML(state.idx)}<\/div>\n        <\/div>\n\n        <div class=\"r-boxes\">\n          <div class=\"r-box r-guess\">\n            <div class=\"r-lbl\">You guessed<\/div>\n            <div class=\"r-val\">${fmtFull(h.guess)}<\/div>\n          <\/div>\n          <div class=\"r-box r-answer\" style=\"border-color:${pal.base};\">\n            <div class=\"r-lbl\">Answer<\/div>\n            <div class=\"r-val\">${fmtFull(h.answer)}<\/div>\n            <div class=\"r-unit\">${h.unit}<\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"r-split\">\n          <div class=\"r-verdict\">\n            <div class=\"vlbl\">You landed<\/div>\n            <div class=\"vbig\">${multStr}<\/div>\n            <div class=\"vsub\">${v.dir}<br>${v.closeness}<\/div>\n          <\/div>\n          <div class=\"r-divider\"><\/div>\n          <div class=\"r-hist\">\n            <div class=\"hlbl\">How everyone guessed<\/div>\n            <div class=\"hist-bars\">\n              <div class=\"truth-line\" style=\"left:${truthPct}%;\"><\/div>\n              ${bars}\n            <\/div>\n            <div class=\"hist-scale\"><span>${fmtCompact(q.min)}<\/span><span>${fmtCompact(q.answer)}<\/span><span>${fmtCompact(q.max)}<\/span><\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"accordion\" id=\"accordion\">\n          <div class=\"accordion-head\" id=\"accordion-head\">\n            <span>Napkin math<\/span>\n            <span class=\"chev\">&darr;<\/span>\n          <\/div>\n          <div class=\"accordion-body\">\n            <div class=\"accordion-body-inner\">${q.source}<\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"card-bottom-row\">\n          <button class=\"pill-btn ghost\" id=\"next-btn\" style=\"width:100%;\">\n            ${state.idx+1 >= state.pool.length ? 'See final score \u2192' : 'Next question \u2192'}\n          <\/button>\n        <\/div>\n      <\/div>\n    <\/div>\n  `;\n\n  document.getElementById('accordion-head').addEventListener('click', ()=>{\n    state.accordionOpen = !state.accordionOpen;\n    document.getElementById('accordion').classList.toggle('open', state.accordionOpen);\n  });\n  document.getElementById('next-btn').addEventListener('click', ()=>{\n    if (state.idx+1 >= state.pool.length){ state.screen = \"summary\"; }\n    else { state.idx += 1; state.screen = \"question\"; }\n    render();\n  });\n}\n\nfunction renderSummary(){\n  const n = state.history.length;\n  const geoMeanMult = Math.pow(10, state.history.reduce((s,h)=>s+Math.log10(h.mult),0)/n);\n  const sortedMults = state.history.map(h=>h.mult).sort((a,b)=>a-b);\n  const bucketEdges = [1,2,5,10,20,50,100,1000];\n  const bars = bucketEdges.map((edge,i)=>{\n    const lo = i===0?1:bucketEdges[i-1];\n    return sortedMults.filter(m=>m>lo && m<=edge).length;\n  });\n  const maxBar = Math.max(...bars,1);\n  const yourBucketIdx = (()=>{ for (let i=0;i<bucketEdges.length;i++){ if (geoMeanMult<=bucketEdges[i]) return i; } return bucketEdges.length-1; })();\n  const histBars = bars.map((c,i)=>{\n    const isYou = i===yourBucketIdx;\n    const heightPct = Math.max(6,(c/maxBar)*100);\n    return `<div class=\"bar${isYou?' you':''}\" style=\"height:${heightPct}%;\"><\/div>`;\n  }).join('');\n\n  let tier;\n  if (geoMeanMult <= 1.5) tier = \"Top 2%\";\n  else if (geoMeanMult <= 2.5) tier = \"Top 10%\";\n  else if (geoMeanMult <= 5) tier = \"Top 35%\";\n  else if (geoMeanMult <= 10) tier = \"Middle of the pack\";\n  else tier = \"Room to grow\";\n\n  const rows = state.history.map(h=>{\n    const dirSign = h.guess < h.answer ? '&lt;' : (h.guess > h.answer ? '&gt;' : '=');\n    const pal = PALETTE[h.paletteIdx];\n    return `\n      <div class=\"q-row\">\n        <span class=\"qr-swatch\" style=\"background:${pal.base};\"><\/span>\n        <span class=\"qr-text\">${h.q}<\/span>\n        <span class=\"qr-mult\">${dirSign} ${h.mult.toFixed(2).replace(/\\.00$/,'')}\u00d7<\/span>\n      <\/div>\n    `;\n  }).join('');\n\n  const today = new Date();\n  const dateStr = today.toLocaleDateString('en-US', {month:'long', day:'numeric', year:'numeric'});\n\n  stage.innerHTML = `\n    <div class=\"kicker\">ROUND COMPLETE &middot; <b>${n} questions<\/b><\/div>\n    <div class=\"stack-wrap\">\n      <div class=\"card s-card flat\">\n        <div class=\"card-top\">\n          <div class=\"card-top-row\">\n            <span class=\"brand\">Fermi.gg<\/span>\n            <span class=\"edition\">${dateStr}<\/span>\n          <\/div>\n        <\/div>\n        <div class=\"s-eyebrow\">Score<\/div>\n        <div class=\"s-score\">${geoMeanMult.toFixed(2).replace(/\\.00$/,'')}&times;<\/div>\n        <div class=\"s-badge\">${tier}<\/div>\n\n        <div class=\"s-hist-label\">How everyone did<\/div>\n        <div class=\"s-hist-bars\">${histBars}<\/div>\n        <div class=\"s-hist-scale\"><span>1&times;<\/span><span>10&times;<\/span><span>100&times;<\/span><span>1,000&times;<\/span><\/div>\n\n        <div class=\"q-list\">${rows}<\/div>\n\n        <div class=\"s-btn-row\   size:{ title:"Size It Up", html: "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Size It Up<\/title>\n<style>\n  :root{\n    --ink:#1a1a1a;\n    --page:#f4f1ea;\n    --grid-bg:#fbeee0;\n    --grid-line:#eeddc4;\n    --card-border:#d9c39c;\n    --blue:#2c3e8c;\n    --red:#c0392b;\n    --red-deep:#a5301f;\n    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;\n  }\n  *{box-sizing:border-box;}\n  html,body{margin:0;padding:0;}\n  body{ background:var(--page); font-family:var(--font); color:var(--ink); min-height:100vh; padding:0 0 60px; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; }\n  #stage{ max-width:1000px; margin:0 auto; padding:28px 24px 0; }\n\n  .page-title{ display:flex; align-items:center; justify-content:center; gap:8px; font-size:30px; font-weight:800; letter-spacing:-0.01em; margin:6px 0 14px; }\n  .help-icon{ width:20px; height:20px; border-radius:50%; border:1.5px solid #b5aa93; color:#8a8071; display:inline-flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; cursor:pointer; flex-shrink:0; }\n  .page-rule{ border:none; border-top:1px solid #ddd3bd; margin:0 0 22px; }\n  .prompt-line{ text-align:center; font-size:15px; color:#4a4438; margin-bottom:10px; }\n  .round-line{ text-align:center; font-weight:700; font-size:12px; letter-spacing:0.06em; text-transform:uppercase; color:#7c7568; margin-bottom:18px; }\n  .round-line b{ color:var(--ink); font-size:14px; letter-spacing:0; margin:0 3px; }\n\n  .canvas-wrap{\n    position:relative; border-radius:16px; overflow:hidden;\n    background: linear-gradient(var(--grid-line) 1px, transparent 1px) 0 0 / 42px 42px, linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) 0 0 / 42px 42px, var(--grid-bg);\n    border:2px solid var(--card-border); height:440px; touch-action:none; user-select:none; max ventListener('click', lockInAnswer);\n}\n\nfunction shapeBoxFor(shape, dimPx, dim){\n  if (dim === 'height') return {w: dimPx*shape.ar, h: dimPx};\n  return {w: dimPx, h: dimPx/shape.ar};\n}\n\nlet dragListenersBound = false;\nlet activeDrag = null;\nfunction bindDragListeners(){\n  if (dragListenersBound) return;\n  dragListenersBound = true;\n  window.addEventListener('mousemove', e=>{ if(activeDrag) activeDrag.move(e.clientX, e.clientY); });\n  window.addEventListener('mouseup', ()=>{ if(activeDrag) activeDrag.end(); });\n  window.addEventListener('touchmove', e=>{ if(activeDrag){ const t=e.touches[0]; activeDrag.move(t.clientX,t.clientY); } }, {passive:true});\n  window.addEventListener('touchend', ()=>{ if(activeDrag) activeDrag.end(); });\n}\n\nfunction mountCanvas(pair){\n  bindDragListeners();\n  const wrap = document.getElementById('canvas-wrap');\n  const wrapRect = wrap.getBoundingClientRect();\n  const refShape = SHAPES[pair.ref.shape];\n  const targetShape = SHAPES[pair.target.shape];\n\n  const groundLine = document.createElement('div');\n  groundLine.className = 'ground-line';\n  groundLine.style.bottom = '6px';\n  wrap.appendChild(groundLine);\n\n  const refBox = shapeBoxFor(refShape, pair.ref.value*roundRuntime.pxPerMeter, pair.dim);\n  const refEl = document.createElement('div');\n  refEl.className = 'silhouette enter';\n  refEl.style.left = '40px';\n  refEl.style.width = refBox.w+'px';\n  refEl.style.height = refBox.h+'px';\n  refEl.style.color = 'var(--blue)';\n  refEl.innerHTML = `<svg viewBox=\"${refShape.vb}\" xmlns=\"http://www.w3.org/2000/svg\">${refShape.base}<\/svg><div class=\"cap\">${pair.ref.name}<\/div>`;\n  wrap.appendChild(refEl);\n\n  const targetEl = document.createElement('div');\n  targetEl.className = 'silhouette enter';\n  targetEl.style.color = 'var(--red)';\n  targetEl.style.animationDelay = '.15s';\n  wrap.appendChild(targetEl);\n\n  const handle = document.createElement('div');\n  handle.className = 'resize-handle';\n  handle.innerHTML = RESIZE_ICON;\n  wrap.appendChild(handle);\n\n  const targetLeft = ()=> 40 + refBox.w + 60;\n\n  function layoutTarget(){\n    const box = shapeBoxFor(targetShape, roundRuntime.targetPx, pair.dim);\n    targetEl.style.width = box.w+'px';\n    targetEl.style.height = box.h+'px';\n    targetEl.style.left = targetLeft()+'px';\n    targetEl.innerHTML = `<svg viewBox=\"${targetShape.vb}\" xmlns=\"http://www.w3.org/2000/svg\">${targetShape.base}<\/svg>`;\n    const hx = targetLeft() + box.w - 8;\n    const hy = wrapRect.height - 6 - box.h - 8;\n    handle.style.left = Math.max(20, Math.min(wrapRect.width-44, hx))+'px';\n    handle.style.top = Math.max(6, hy)+'px';\n  }\n  layoutTarget();\n\n  function start(x,y){\n    roundRuntime.dragStartX = x; roundRuntime.dragStartY = y; roundRuntime.dragStartPx = roundRuntime.targetPx;\n    activeDrag = {\n      move(cx,cy){\n        const delta = pair.dim==='height' ? (roundRuntime.dragStartY - cy) : (cx - roundRuntime.dragStartX);\n        roundRuntime.targetPx = Math.max(6, roundRuntime.dragStartPx + delta);\n        layoutTarget();\n      },\n      end(){ activeDrag = null; }\n    };\n  }\n  handle.addEventListener('mousedown', e=>{ e.preventDefault(); start(e.clientX, e.clientY); });\n  handle.addEventListener('touchstart', e=>{ const t=e.touches[0]; start(t.clientX,t.clientY); }, {passive:true});\n\n  function zoom(ratio){\n    roundRuntime.pxPerMeter *= ratio;\n    roundRuntime.targetPx *= ratio;\n    const b = shapeBoxFor(refShape, pair.ref.value*roundRuntime.pxPerMeter, pair.dim);\n    refEl.style.width = b.w+'px'; refEl.style.height = b.h+'px';\n    layoutTarget();\n  }\n  document.getElementById('zoom-in').addEventListener('click', ()=>zoom(1.15));\n  document.getElementById('zoom-out').addEventListener('click', ()=>zoom(1/1.15));\n\n  mountCanvas._ctx = {wrap, refEl, targetEl, handle, refShape, targetShape, targetLeft, refBox};\n}\n\nfunction lockInAnswer(){\n  if (roundRuntime.locked) return;\n  const pair = currentPair();\n  const guess = targetPxToMeters(roundRuntime.targetPx);\n  const actual = pair.target.value;\n  const pct = pctOff(guess, actual);\n  state.history.push({ name:pair.target.name, refName:pair.ref.name, dim:pair.dim, guess, actual, pct, score:scoreFromPct(pct) });\n  roundRuntime.locked = true;\n  renderReveal();\n}\n\nfunction renderReveal(){\n  const pair = currentPair();\n  const h = state.history[state.history.length-1];\n  const ctx = mountCanvas._ctx;\n  const wrap = ctx.wrap;\n\n  /* the player's guess stays as a faded silhouette; the true-size textured one overlaps it */\n  const guessBox = shapeBoxFor(ctx.targetShape, roundRuntime.targetPx, pair.dim);\n  ctx.handle.style.display = 'none';\n  ctx.targetEl.style.color = 'rgba(120,130,150,0.45)';\n  ctx.targetEl.style.width = guessBox.w+'px';\n  ctx.targetEl.style.height = guessBox.h+'px';\n  ctx.targetEl.innerHTML = `<svg viewBox=\"${ctx.targetShape.vb}\" xmlns=\"http://www.w3.org/2000/svg\">${ctx.targetShape.base}<\/svg><div class=\"cap guess-cap\">Your guess<\/div>`;\n\n  const trueBox = shapeBoxFor(ctx.targetShape, pair.target.value*roundRuntime.pxPerMeter, pair.dim);\n  const trueEl = document.createElement('div');\n  trueEl.className = 'silhouette anim';\n  trueEl.style.color = 'var(--red)';\n  trueEl.style.left = ctx.targetLeft()+'px';\n  /* starts exactly at the guess size, then grows/shrinks to the truth */\n  trueEl.style.width = guessBox.w+'px';\n  trueEl.style.height = guessBox.h+'px';\n  trueEl.style.opacity = '0.85';\n  trueEl.innerHTML = `<svg viewBox=\"${ctx.targetShape.vb}\" xmlns=\"http://www.w3.org/2000/svg\">${ctx.targetShape.base}${ctx.targetShape.shade||''}<\/svg>`;\n  wrap.appendChild(trueEl);\n  ctx.targetEl.classList.remove('enter');\n  ctx.targetEl.classList.add('anim');\n  void trueEl.offsetWidth;\n  setTimeout(()=>{\n    trueEl.style.opacity = '1';\n    trueEl.style.width = trueBox.w+'px';\n    trueEl.style.height = trueBox.h+'px';\n  }, REDUCED ? 0 : 450);\n\n  ctx.refEl.innerHTML = `<svg viewBox=\"${ctx.refShape.vb}\" xmlns=\"http://www.w3.org/2000/svg\">${ctx.refShape.base}${ctx.refShape.shade||''}<\/svg><div class=\"cap\">${pair.ref.name}<\/div>`;\n\n  const badge = document.createElement('div');\n  badge.className = 'score-badge';\n  badge.innerHTML = `\n    <div class=\"sb-num\"><b id=\"sb-score\">0<\/b><span> / 100<\/span><\/div>\n    <div class=\"sb-row\">Your Answer: <b>${fmtDim(h.guess)}<\/b><\/div>\n    <div class=\"sb-row\">Actual: <b>${fmtDim(h.actual)}<\/b> (${pair.dim})<\/div>\n    <div class=\"sb-off\">Off by ${Math.round(h.pct)}%<\/div>`;\n  wrap.appendChild(badge);\n  countUp(document.getElementById('sb-score'), h.score, 1000, v=>String(Math.round(v)), 650);\n  setTimeout(()=>{ const n = badge.querySelector('.sb-num'); n.classList.add('pop'); }, REDUCED?0:1650);\n\n  wrap.querySelector('.zoom-controls').style.display = 'none';\n  const fit = document.createElement('button');\n  fit.className = 'fit-btn';\n  fit.innerHTML = `${FIT_ICON}<span>Fit both<\/span>`;\n  wrap.appendChild(fit);\n  fit.addEventListener('click', ()=>{\n    [ctx.refEl, ctx.targetEl, trueEl].forEach(el=>el.classList.add('anim'));\n    const r = wrap.getBoundingClientRect();\n    const biggest = Math.max(pair.ref.value, pair.target.value, h.guess);\n    const available = pair.dim==='height' ? (r.height-70) : (r.width-140);\n    const s = available / biggest;\n    roundRuntime.pxPerMeter = s;\n    const rb = shapeBoxFor(ctx.refShape, pair.ref.value*s, pair.dim);\n    ctx.refEl.style.width = rb.w+'px'; ctx.refEl.style.height = rb.h+'px';\n    const left = 40 + rb.w + 60;\n    const tb = shapeBoxFor(ctx.targetShape, pair.target.value*s, pair.dim);\n    trueEl.style.left = left+'px'; trueEl.style.width = tb.w+'px'; trueEl.style.height = tb.h+'px';\n    const gb = shapeBoxFor(ctx.targetShape, h.guess*s, pair.dim);\n    ctx.targetEl.style.left = left+'px'; ctx.targetEl.style.width = gb.w+'px'; ctx.targetEl.style.height = gb.h+'px';\n  });\n\n  const isLast = state.idx+1 >= state.pool.length;\n  const lockBtn = document.getElementById('lock-btn');\n  const nb = lockBtn.cloneNode(true);\n  nb.innerHTML = isLast ? 'See Final Score \ud83c\udfc6' : 'Next Round &rarr;';\n  lockBtn.replaceWith(nb);\n  nb.addEventListener('click', ()=>{\n    if (isLast) state.screen = \"summary\"; else { state.idx += 1; state.screen = \"playing\"; }\n    render();\n  });\n  document.querySelector('.round-line').innerHTML = `Round <b>${state.idx+1}<\/b> / ${state.pool.length} &nbsp; Score <b>${totalScore()}<\/b>`;\n}\n\nfunction renderThumb(pair){\n  const rs = SHAPES[pair.ref.shape], ts = SHAPES[pair.target.shape];\n  const vert = pair.dim==='height';\n  let scale = (vert ? 100 : 80) / pair.ref.value;\n  const maxT = vert ? 140 : 150;\n  if (pair.target.value*scale > maxT) scale *= maxT/(pair.target.value*scale);\n  const rb = shapeBoxFor(rs, pair.ref.value*scale, pair.dim);\n  const tb = shapeBoxFor(ts, pair.target.value*scale, pair.dim);\n  return `\n    <div class=\"ground-shadow\" style=\"height:40px;\"><\/div>\n    <div class=\"ground-line\" style=\"bottom:6px;\"><\/div>\n    <div class=\"silhouette\" style=\"left:16px;width:${rb.w}px;height:${rb.h}px;color:var(--blue);\"><svg viewBox=\"${rs.vb}\">${rs.base}${rs.shade||''}<\/svg><\/div>\n    <div class=\"silhouette\" style=\"left:${16+rb.w+22}px;width:${tb.w}px;height:${tb.h}px;color:var(--red);\"><svg viewBox=\"${ts.vb}\">${ts.base}${ts.shade||''}<\/svg><\/div>`;\n}\n\nfunction mulberry32(a){ return function(){ a|=0; a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }\n\nfunction renderSummary(){\n  const n = state.history.length;\n  const total = totalScore();\n  const maxPossible = n*100;\n  const avg = total/n;\n  let verdict;\n  if (avg >= 85) verdict = \"Elite eye for scale. You barely needed the reference.\";\n  else if (avg >= 65) verdict = \"Sharp estimator. Your sense of scale is well calibrated.\";\n  else if (avg >= 40) verdict = \"A tricky set. Keep training your eye for scale.\";\n  else verdict = \"Scale is deceptive. Keep training your eye.\";\n\n  const bucketCount = 5;\n  const bucketSize = maxPossible / bucketCount;\n  const rand = mulberry32(n*137 + Math.round(total));\n  const counts = [];\n  for (let i=0;i<bucketCount;i++){\n    const d = i - (bucketCount*0.5);\n    counts.push(Math.round(Math.max(600, 79000*Math.exp(-d*d*0.9)) * (0.85+rand()*0.3)));\n  }\n  const yourBucket = Math.min(bucketCount-1, Math.floor(total/bucketSize));\n  const totalPlayers = counts.reduce((a,b)=>a+b,0);\n  let below = 0;\n  for (let i=0;i<yourBucket;i++) below += counts[i];\n  const within = (total - yourBucket*bucketSize) / bucketSize;\n  below += counts[yourBucket]*within;\n  const beatPct = Math.max(1, Math.min(99, Math.round(below/totalPlayers*100)));\n  const rank = Math.max(1, Math.round(totalPlayers - below));\n  const avgAll = (maxPossible*0.53).toFixed(1);\n  const maxC = Math.max(...counts);\n\n  const rows = state.history.map((h,i)=>`\n    <div class=\"round-row\" data-idx=\"${i}\">\n      <span class=\"rr-label\">ROUND ${i+1}<\/span>\n      <div class=\"rr-bar-track\"><div class=\"rr-bar-fill\" data-w=\"${h.score}%\"><\/div><\/div>\n      <span class=\"rr-score\">${h.score}<\/span>\n    <\/div>`).join('');\n\n  const cols = counts.map((c,i)=>{\n    const lo = Math.round(i*bucketSize);\n    const hi = Math.round((i+1)*bucketSize) - (i===bucketCount-1 ? 0 : 1);\n    const you = i===yourBucket;\n    return `<div class=\"hist-col\">\n      <div class=\"hist-bar-area\"><span class=\"hist-count\">${c.toLocaleString()}<\/span><div class=\"hist-bar${you?' you':''}\" data-h=\"${Math.max(4,(c/maxC)*100)}%\"><\/div><\/div>\n      <span class=\"hist-range${you?' you':''}\">${lo}-${hi}<\/span><\/div>`;\n  }).join('');\n\n  stage.innerHTML = `\n    ${pageHeader()}\n    <div class=\"results-block\">\n      <div class=\"section-label\">Your rounds<\/div>\n      <div class=\"rounds-panel\">\n        <div class=\"rounds-list\"><div>${rows}<\/div><div class=\"hover-hint\">Hover a round to revisit it.<\/div><\/div>\n        <div class=\"round-thumb\" id=\"round-thumb\">${renderThumb(state.pool[0])}<\/div>\n      <\/div>\n      <hr class=\"divider-thin\">\n      <div class=\"total-score-block\">\n        <div class=\"total-score-num\" id=\"total-num\">0<\/div>\n        <div class=\"total-score-den\">(OUT OF ${maxPossible})<\/div>\n        <div class=\"total-progress\"><div class=\"total-progress-fill\" data-w=\"${Math.min(100,total/maxPossible*100)}%\"><\/div><\/div>\n        <div class=\"verdict-text\">${verdict}<\/div>\n        <div class=\"share-row\"><button class=\"pill-btn\" id=\"share-btn\">${SHARE_ICON}<span>Share result<\/span><\/button><\/div>\n      <\/div>\n      <hr class=\"divider-thin\">\n      <div class=\"compare-head\">\n        <div class=\"compare-head-left\">${BARCHART_ICON}<span>How you compared<\/span><\/div>\n        <div class=\"compare-rank\">Rank #${rank.toLocaleString()}<\/div>\n      <\/div>\n      <div class=\"hist-panel\">\n        <div class=\"hist-bars-wrap\">${cols}<\/div>\n        <div class=\"hist-stats\">\n          <div class=\"hist-stat\"><div class=\"hs-label\">Average<\/div><div class=\"hs-value\" id=\"avg-num\">0<\/div><\/div>\n          <div class=\"hist-stat beat\"><div class=\"hs-label\">Beat<\/div><div class=\"hs-value\" id=\"beat-num\">0%<\/div><\/div>\n        <\/div>\n      <\/div>\n      <hr class=\"divider-full\">\n      <div class=\"about-strip${state.aboutOpen?' open':''}\" id=\"about-strip\">\n        <div class=\"about-head\" id=\"about-head\"><div><div class=\"about-eyebrow\">A game by Magnitudle<\/div><div class=\"about-title\">About Size It Up<\/div><\/div><span class=\"about-plus\">+<\/span><\/div>\n        <div class=\"about-body\"><div class=\"about-body-inner\">Size It Up tests your intuition for real-world scale. Each round pairs a familiar object at true size with a mystery silhouette you resize by eye.<\/div><\/div>\n      <\/div>\n      <div class=\"start-row\" style=\"margin-top:24px;\"><button class=\"pill-btn\" id=\"again-btn\">Play again<\/button><\/div>\n    <\/div>`;\n\n  growWidths('.rr-bar-fill'); growWidths('.total-progress-fill'); growHeights('.hist-bar');\n  countUp(document.getElementById('total-num'), total, 1200, v=>String(Math.round(v)), 200);\n  countUp(document.getElementById('avg-num'), parseFloat(avgAll), 1000, v=>v.toFixed(1), 500);\n  countUp(document.getElementById('beat-num'), beatPct, 1000, v=>Math.round(v)+'%', 500);\n  document.getElementById('again-btn').addEventListener('click', startGame);\n  document.getElementById('share-btn').addEventListener('click', ()=>{\n    const btn = document.getElementById('share-btn');\n    const orig = btn.innerHTML;\n    try{ navigator.clipboard.writeText(`Size It Up: ${total}/${maxPossible} (beat ${beatPct}% of players)`); }catch(e){}\n    btn.innerHTML = '<span>Copied!<\/span>';\n    setTimeout(()=>{ btn.innerHTML = orig; }, 1400);\n  });\n  document.getElementById('about-head').addEventListener('click', ()=>{\n    state.aboutOpen = !state.aboutOpen;\n    document.getElementById('about-strip').classList.toggle('open', state.aboutOpen);\n  });\n  document.querySelectorAll('.round-row').forEach(row=>{\n    row.addEventListener('mouseenter', ()=>{\n      document.getElementById('round-thumb').innerHTML = renderThumb(state.pool[parseInt(row.dataset.idx,10)]);\n    });\n  });\n}\n\nrender();\n<\/script>\n<\/body>\n<\/html>\n" },

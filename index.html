d country.\",\n   \"A guess on a shortest route is perfect. Otherwise you're told how many countries the detour costs.\",\n   \"Order doesn't matter \u2014 you're just collecting the right countries.\",\n   \"Scroll or pinch to zoom, drag to pan, and use the reset button to return.\"]}\n};\nconst store={get(k,fb){try{const v=localStorage.getItem(\"travle:\"+k);return v===null?fb:JSON.parse(v);}catch(e){return fb;}},\n  set(k,v){try{localStorage.setItem(\"travle:\"+k,JSON.stringify(v));}catch(e){}}};\nlet prefs=Object.assign({lang:\"nl\",theme:\"dark\",proj:\"azimuthal\"},store.get(\"prefs\",{}));\nfunction savePrefs(){store.set(\"prefs\",prefs);applyTheme();}\nfunction applyTheme(){document.documentElement.dataset.theme=prefs.theme===\"light\"?\"light\":\"dark\";\n  document.documentElement.lang=prefs.lang;}\nconst T=()=>STR[prefs.lang];\nconst NAME=c=>C[c]?(prefs.lang===\"nl\"?C[c].nl:C[c].en):c;\nlet stats=Object.assign({played:0,won:0,streak:0,best:0,dist:{},last:null},store.get(\"stats\",{}));\nconst saveStats=()=>store.set(\"stats\",stats);\n\n/* ===================================================================\n   3. Routes\n   =================================================================== */\nconst EPOCH=Date.UTC(2022,11,15), DAY=86400000;\nconst todayUTC=()=>{const n=new Date();return Date.UTC(n.getFullYear(),n.getMonth(),n.getDate());};\nconst gameNoFor=ms=>Math.floor((ms-EPOCH)/DAY)+1;\nfunction rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;\n  let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}\nconst BIG=CODES.filter(c=>CODES.filter(x=>COMP[x]===COMP[c]).length>20);\nfunction routeForSeed(seed,o){\n  o=o||{}; const lo=o.minLen||4, hi=o.maxLen||10, r=rng(seed);\n  for(let i=0;i<5000;i++){\n    const a=BIG[Math.floor(r()*BIG.length)], b=BIG[Math.floor(r()*BIG.length)];\n    if(a===b||COMP[a]!==COMP[b]) continue;\n    const p=shortestPath(a,b); if(!p) continue;\n    const e=p.length-1; if(e<lo||e>hi) continue;\n    return {start:a,end:b,path:p};\n  }\n  return {start:\"PT\",end:\"PL\",path:shortestPath(\"PT\",\"PL\")};\n}\n\n/* ===================================================================\n   4. Game state\n   =================================================================== */\nlet G=null;\nfunction newGame(cfg){\n  const route=cfg.route||routeForSeed(cfg.seed,cfg);\n  const E=route.path.length-1;\n  G={mode:cfg.mode,no:cfg.no||null,seed:cfg.seed,\n     start:route.start,end:route.end,path:route.path,best:E,\n     dS:bfs(route.start),dE:bfs(route.end),\n     max:E+Math.floor(E/2)+1+(cfg.extra||0),\n     guesses:[],hints:0,revealed:[],showInitials:false,\n     over:false,win:false,showPrev:true};\n  MAP.gameKey=null;\n}\nconst detour=c=>{const a=G.dS[c],b=G.dE[c];return(a===undefined||b===undefined)?null:a+b-G.best;};\nfunction solvedPath(){\n  const set=new Set(G.guesses.filter(g=>g.d!==null).map(g=>g.code));\n  set.add(G.start); set.add(G.end);\n  const prev={[G.start]:null},q=[G.start];\n  for(let i=0;i<q.length;i++){const x=q[i];\n    if(x===G.end){const o=[];for(let y=G.end;y!==null;y=prev[y])o.push(y);return o.reverse();}\n    for(const y of C[x].nb) if(set.has(y)&&prev[y]===undefined){prev[y]=x;q.push(y);}}\n  return null;\n}\nfunction missingCountries(){\n  const free=new Set(G.guesses.filter(g=>g.d!==null).map(g=>g.code));\n  const p=cheapestPath(G.start,G.end,free);\n  if(!p) return {list:G.path.slice(1,-1),path:G.path};\n  return {list:p.slice(1,-1).filter(c=>!free.has(c)),path:p};\n}\nfunction submitGuess(text){\n  if(G.over) return;\n  const code=lookup(text);\n  if(!code) return toast(T().unknown);\n  if(code===G.start||code===G.end) return toast(T().isEndpoint);\n  if(G.guesses.some(g=>g.code===code)) return toast(T().already);\n  const d=detour(code);\n  G.guesses.push({code,d});\n  const sp=solvedPath();\n  if(sp){G.over=true;G.win=true;G.solution=sp;record();}\n  else if(G.guesses.length>=G.max){G.over=true;G.win=false;record();}\n  render();\n  mapApplyState(code);\n  if(G.over) setTimeout(openResults,700);\n}\nfunction bucketOf(){\n  if(!G.win) return \"X\";\n  return Math.min(6,G.guesses.length-(G.best-1));\n}\nfunction record(){\n  if(G.mode!==\"daily\") return;\n  const key=\"d\"+G.no; if(stats.last===key) return;\n  stats.last=key; stats.played++;\n  if(G.win){stats.won++;stats.streak++;stats.best=Math.max(stats.best,stats.streak);}\n  else stats.streak=0;\n  const b=bucketOf(); stats.dist[b]=(stats.dist[b]||0)+1;\n  saveStats();\n}\nconst norm=s=>(s||\"\").toLowerCase().normalize(\"NFD\").replace(/[\\u0300-\\u036f]/g,\"\").replace(/[^a-z]/g,\"\");\nfunction lookup(text){\n  const s=norm(text); if(!s) return null;\n  for(const c of CODES) if(norm(C[c].nl)===s||norm(C[c].en)===s) return c;\n  const h=CODES.filter(c=>norm(C[c].nl).startsWith(s)||norm(C[c].en).startsWith(s));\n  return h.length===1?h[0]:null;\n}\n\n/* ===================================================================\n   5. MAP ENGINE \u2014 real outlines, wheel zoom, drag pan, animated fly-to\n   =================================================================== */\nconst MAP={\n  ready:false, real:false, paths:null, W:360, H:180,\n  svg:null, gLand:null, gTop:null, gLbl:null, gGrat:null,\n  cam:null, home:null, anim:null, bb:{}, cal:null, gameKey:null, nodes:{}\n};\nconst reduced = matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\n\n/* -- load world geometry from a vector-map package (script, CSP-safe) -- */\nfunction loadGeo(done){\n  const urls=[\n    \"https://cdn.jsdelivr.net/npm/jsvectormap@1.5.3/dist/maps/world.js\",\n    \"https://cdnjs.cloudflare.com/ajax/libs/jsvectormap/1.5.3/maps/world.js\",\n    \"https://cdn.jsdelivr.net/npm/jsvectormap@1.6.0/dist/maps/world.js\",\n    \"https://cdn.jsdelivr.net/npm/jquery-jvectormap-world-mill@1.0.0/jquery-jvectormap-world-mill.js\"\n  ];\n  let got=null;\n  const grab=d=>{ if(got||!d||!d.paths) return; got=d; };\n  window.jsVectorMap={addMap:(n,d)=>grab(d)};\n  window.jQuery=window.jQuery||{};\n  window.jQuery.fn=window.jQuery.fn||{};\n  window.jQuery.fn.vectorMap=function(a,b,c){ if(a===\"addMap\") grab(c); };\n  window.$=window.$||window.jQuery;\n\n  let i=0;\n  (function next(){\n    if(got||i>=urls.length) return finish();\n    const s=document.createElement(\"script\");\n    s.src=urls[i++]; s.async=true;\n    s.onload=()=>setTimeout(()=>{got?finish():next();},0);\n    s.onerror=next;\n    document.head.appendChild(s);\n    setTimeout(()=>{ if(!got && s.parentNode && !s.dataset.h){ s.dataset.h=\"1\"; } },4000);\n  })();\n\n  function finish(){\n    if(got){\n      MAP.paths={}; \n      for(const k in got.paths){\n        const p=got.paths[k];\n        const d=typeof p===\"string\"?p:(p.path||p.d);\n        if(d) MAP.paths[k.toUpperCase()]=d;\n      }\n      MAP.W=got.width||900; MAP.H=got.height||440;\n      MAP.real=true;\n    }\n    MAP.ready=true;\n    done&&done();\n  }\n}\n\n/* Miller y, used for calibrating lat/lon -> map units */\nconst millerY=lat=>1.25*Math.log(Math.tan(Math.PI/4+0.4*lat*Math.PI/180));\nfunction fitLine(xs,ys){\n  const n=xs.length; let sx=0,sy=0,sxx=0,sxy=0;\n  for(let i=0;i<n;i++){sx+=xs[i];sy+=ys[i];sxx+=xs[i]*xs[i];sxy+=xs[i]*ys[i];}\n  const a=(n*sxy-sx*sy)/(n*sxx-sx*sx||1), b=(sy-a*sx)/n;\n  let r=0; for(let i=0;i<n;i++){const e=a*xs[i]+b-ys[i]; r+=e*e;}\n  return {a,b,r};\n}\n/* compact countries used as calibration anchors (no scattered territories) */\nconst ANCHORS=[\"PL\",\"DE\",\"IT\",\"TR\",\"EG\",\"KE\",\"ZA\",\"IN\",\"TH\",\"MX\",\"PE\",\"BO\",\"SE\",\"UA\",\"IR\",\n  \"NG\",\"ET\",\"VN\",\"MN\",\"KZ\",\"CO\",\"AR\",\"PY\",\"ZW\",\"MA\",\"SY\",\"AF\",\"NP\",\"BY\",\"RO\",\"GH\",\"AO\"];\nfunction calibrate(){\n  const xs=[],ys=[],lat=[],lon=[];\n  ANCHORS.forEach(c=>{\n    const b=MAP.bb[c]; if(!b||!C[c]) return;\n    xs.push(b.x+b.width/2); ys.push(b.y+b.height/2); lon.push(C[c].lon); lat.push(C[c].lat);\n  });\n  if(xs.length<6) return null;\n  const fx=fitLine(lon,xs);\n  const fMill=fitLine(lat.map(millerY),ys), fFlat=fitLine(lat,ys);\n  const useMiller=fMill.r<=fFlat.r;\n  return {fx, fy:useMiller?fMill:fFlat, miller:useMiller};\n}\nfunction toXY(lat,lon){\n  if(MAP.cal){\n    const {fx,fy,miller}=MAP.cal;\n    return [fx.a*lon+fx.b, fy.a*(miller?millerY(lat):lat)+fy.b];\n  }\n  return [lon+180, 90-lat];\n}\nfunction boxOf(code){\n  const b=MAP.bb[code];\n  if(b && b.width>0.01) return {x:b.x,y:b.y,w:b.width,h:b.height};\n  const [x,y]=toXY(C[code].lat,C[code].lon);\n  const s=MAP.W/120;\n  return {x:x-s/2,y:y-s/2,w:s,h:s};\n}\nfunction unionBox(codes){\n  const bs=codes.map(boxOf);\n  const x0=Math.min(...bs.map(b=>b.x)), y0=Math.min(...bs.map(b=>b.y));\n  const x1=Math.max(...bs.map(b=>b.x+b.w)), y1=Math.max(...bs.map(b=>b.y+b.h));\n  return {x:x0,y:y0,w:x1-x0,h:y1-y0};\n}\nfunction frame(box,pad){\n  const el=MAP.svg, r=el?el.getBoundingClientRect():{width:540,height:400};\n  const ar=(r.width||540)/(r.height||400);\n  const minW=MAP.W/90;\n  let w=Math.max(box.w*(1+pad), minW), h=Math.max(box.h*(1+pad), minW/ar);\n  if(w/h<ar) w=h*ar; else h=w/ar;\n  w=Math.min(w,MAP.W*1.6); h=w/ar;\n  return {x:box.x+box.w/2-w/2, y:box.y+box.h/2-h/2, w,h};\n}\nfunction applyCam(){\n  const c=MAP.cam; if(!MAP.svg||!c) return;\n  MAP.svg.setAttribute(\"viewBox\",`${c.x} ${c.y} ${c.w} ${c.h}`);\n  const fs=Math.max(c.w/52, MAP.W/900);\n  MAP.gLbl && [...MAP.gLbl.children].forEach(t=>{\n    t.setAttribute(\"font-size\",fs);\n    t.setAttribute(\"stroke-width\",fs*0.22);\n  });\n}\nfunction flyTo(box,ms,pad){\n  const to=frame(box,pad===undefined?0.55:pad);\n  if(reduced||!MAP.cam){MAP.cam=to;applyCam();return;}\n  const from={...MAP.cam}, t0=performance.now(), dur=ms||750;\n  cancelAnimationFrame(MAP.anim);\n  const step=t=>{\n    const k=Math.min(1,(t-t0)/dur);\n    const e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;\n    MAP.cam={x:from.x+(to.x-from.x)*e, y:from.y+(to.y-from.y)*e,\n             w:from.w+(to.w-from.w)*e, h:from.h+(to.h-from.h)*e};\n    applyCam();\n    if(k<1) MAP.anim=requestAnimationFrame(step);\n  };\n  MAP.anim=requestAnimationFrame(step);\n}\nconst SVGNS=\"http://www.w3.org/2000/svg\";\nconst mk=(n,at)=>{const e=document.createElementNS(SVGNS,n);for(const k in at)e.setAttribute(k,at[k]);return e;};\n\nfunction buildMap(){\n  const key=G.start+\">\"+G.end+\">\"+G.seed;\n  if(MAP.gameKey===key && MAP.svg) return MAP.svg;\n  MAP.gameKey=key; MAP.nodes={};\n\n  const svg=mk(\"svg\",{class:\"world\",preserveAspectRatio:\"xMidYMid slice\"});\n  const gGrat=mk(\"g\",{class:\"gratg\"}), gLand=mk(\"g\",{}), gTop=mk(\"g\",{}), gLbl=mk(\"g\",{});\n  svg.append(gGrat,gLand,gTop,gLbl);\n  MAP.svg=svg; MAP.gLand=gLand; MAP.gTop=gTop; MAP.gLbl=gLbl; MAP.gGrat=gGrat;\n\n  if(MAP.real){\n    for(const code in MAP.paths){\n      const p=mk(\"path\",{d:MAP.paths[code],class:\"land\"});\n      p.dataset.c=code; gLand.appendChild(p);\n      if(C[code]) MAP.nodes[code]=p;\n    }\n  }\n  /* micro-states and anything the dataset lacks get a circle */\n  svg.setAttribute(\"viewBox\",`0 0 ${MAP.W} ${MAP.H}`);\n  document.body.appendChild(svg);                 // temporary, for getBBox\n  svg.style.position=\"absolute\"; svg.style.left=\"-99999px\";\n  svg.style.width=\"600px\"; svg.style.height=\"300px\";\n  for(const code in MAP.nodes){\n    try{ const b=MAP.nodes[code].getBBox(); MAP.bb[code]=b; }catch(e){}\n  }\n  MAP.cal=MAP.real?calibrate():null;\n  CODES.forEach(code=>{\n    if(MAP.nodes[code]) return;\n    const [x,y]=toXY(C[code].lat,C[code].lon);\n    const c=mk(\"circle\",{cx:x,cy:y,r:MAP.W/240,class:\"land\"});\n    c.dataset.c=code; gLand.appendChild(c); MAP.nodes[code]=c;\n    MAP.bb[code]={x:x-MAP.W/240,y:y-MAP.W/240,width:MAP.W/120,height:MAP.W/120};\n  });\n  svg.style.position=\"\"; svg.style.left=\"\"; svg.style.width=\"\"; svg.style.height=\"\";\n  svg.remove();\n\n  /* graticule */\n  const step=MAP.real?20:30;\n  for(let lon=-180;lon<=180;lon+=step){\n    const a=toXY(-84,lon), b=toXY(84,lon);\n    gGrat.appendChild(mk(\"line\",{x1:a[0],y1:a[1],x2:b[0],y2:b[1],class:\"grat\"}));\n  }\n  for(let lat=-80;lat<=80;lat+=step){\n    const a=toXY(lat,-180), b=toXY(lat,180);\n    gGrat.appendChild(mk(\"line\",{x1:a[0],y1:a[1],x2:b[0],y2:b[1],class:\"grat\"}));\n  }\n\n  MAP.home=unionBox([G.start,G.end]);\n  MAP.cam=frame(MAP.home,0.6);\n  applyCam();\n  wireMapGestures(svg);\n  return svg;\n}\nfunction labelFor(code,color){\n  const b=boxOf(code);\n  const t=mk(\"text\",{x:b.x+b.w/2,y:b.y-b.h*0.12,class:\"lbl\",\"text-anchor\":\"middle\",fill:color});\n  t.textContent = (G.showInitials && !G.guesses.some(g=>g.code===code) && G.revealed.includes(code))\n    ? initials(code) : NAME(code);\n  return t;\n}\nconst initials=c=>NAME(c).split(/[\\s-]+/).filter(Boolean).map(w=>w[0]).join(\"\").toUpperCase();\n\nfunction mapApplyState(justGuessed){\n  if(!MAP.svg) return;\n  const state={};\n  state[G.start]=\"s-start\"; state[G.end]=\"s-end\";\n  G.revealed.forEach(c=>{ if(!state[c]) state[c]=\"s-hint\"; });\n  G.guesses.forEach(g=>{\n    state[g.code]= g.d===null?\"s-far\": g.d===0?\"s-ok\": g.d<=2?\"s-near\":\"s-far\";\n  });\n  if(G.over && !G.win) G.path.forEach(c=>{ if(!state[c]) state[c]=\"s-hint\"; });\n\n  for(const code in MAP.nodes){\n    const n=MAP.nodes[code];\n    if(state[code]) n.setAttribute(\"class\",\"land show \"+state[code]);\n    else if(G.over) n.setAttribute(\"class\",\"land show world\");\n    else n.setAttribute(\"class\",\"land\");\n  }\n  MAP.gLbl.textContent=\"\";\n  Object.keys(state).forEach(code=>{\n    const cls=state[code];\n    const col = cls===\"s-start\"?\"var(--rose)\": cls===\"s-end\"?\"var(--mint)\":\n                cls===\"s-ok\"?\"var(--mint)\": cls===\"s-near\"?\"var(--orange)\":\n                cls===\"s-hint\"?\"var(--gold)\":\"var(--red)\";\n    MAP.gTop.appendChild(MAP.nodes[code]);       // raise above neighbours\n    MAP.gLbl.appendChild(labelFor(code,col));\n  });\n  applyCam();\n\n  if(justGuessed && MAP.nodes[justGuessed]){\n    const n=MAP.nodes[justGuessed];\n    n.classList.remove(\"pulse\"); void n.getBoundingClientRect(); n.classList.add(\"pulse\");\n    const d=detour(justGuessed);\n    const focus = d===null||d>3 ? unionBox([justGuessed,G.start,G.end]) : unionBox([justGuessed,G.end]);\n    flyTo(focus, 820, d===null?0.7:0.85);\n  }\n  if(G.over){\n    if(G.win) flyTo(unionBox([...new Set([...G.path,...G.guesses.map(g=>g.code).filter(c=>detour(c)!==null)])]),900,0.35);\n    else flyTo({x:0,y:0,w:MAP.W,h:MAP.H},950,0.04);\n  }\n}\nfunction wireMapGestures(svg){\n  let drag=null, pinch=null;\n  const pt=e=>{\n    const r=svg.getBoundingClientRect(), c=MAP.cam;\n    return {x:c.x+(e.clientX-r.left)/r.width*c.w, y:c.y+(e.clientY-r.top)/r.height*c.h};\n  };\n  const zoomAt=(px,py,f)=>{\n    cancelAnimationFrame(MAP.anim);\n    const c=MAP.cam;\n    let w=c.w*f;\n    w=Math.max(MAP.W/160, Math.min(MAP.W*1.8, w));\n    const k=w/c.w, h=c.h*k;\n    MAP.cam={x:px-(px-c.x)*k, y:py-(py-c.y)*k, w, h};\n    applyCam();\n  };\n  svg.addEventListener(\"wheel\",e=>{\n    e.preventDefault();\n    const p=pt(e);\n    zoomAt(p.x,p.y,Math.exp((e.deltaMode===1?e.deltaY*16:e.deltaY)*0.0016));\n  },{passive:false});\n  svg.addEventListener(\"pointerdown\",e=>{\n    if(e.pointerType===\"touch\"&&pinch) return;\n    svg.setPointerCapture(e.pointerId);\n    drag={id:e.pointerId,sx:e.clientX,sy:e.clientY,cam:{...MAP.cam}};\n    svg.classList.add(\"drag\"); cancelAnimationFrame(MAP.anim);\n  });\n  svg.addEventListener(\"pointermove\",e=>{\n    if(!drag||e.pointerId!==drag.id) return;\n    const r=svg.getBoundingClientRect();\n    MAP.cam={...drag.cam,\n      x:drag.cam.x-(e.clientX-drag.sx)/r.width*drag.cam.w,\n      y:drag.cam.y-(e.clientY-drag.sy)/r.height*drag.cam.h};\n    applyCam();\n  });\n  const end=e=>{ if(drag&&e.pointerId===drag.id){drag=null;svg.classList.remove(\"drag\");} };\n  svg.addEventListener(\"pointerup\",end); svg.addEventListener(\"pointercancel\",end);\n  svg.addEventListener(\"dblclick\",e=>{const p=pt(e);zoomAt(p.x,p.y,0.55);});\n  /* two-finger pinch */\n  const tp=new Map();\n  svg.addEventListener(\"touchstart\",e=>{ if(e.touches.length===2){drag=null;\n    pinch=dist(e)|0?{d:dist(e),cam:{...MAP.cam}}:null;} },{passive:true});\n  svg.addEventListener(\"touchmove\",e=>{\n    if(e.touches.length===2&&pinch){ e.preventDefault();\n      const r=svg.getBoundingClientRect();\n      const mx=(e.touches[0].clientX+e.touches[1].clientX)/2, my=(e.touches[0].clientY+e.touches[1].clientY)/2;\n      const c=pinch.cam;\n      const px=c.x+(mx-r.left)/r.width*c.w, py=c.y+(my-r.top)/r.height*c.h;\n      MAP.cam={...pinch.cam}; zoomAt(px,py,pinch.d/dist(e));\n    }},{passive:false});\n  svg.addEventListener(\"touchend\",()=>{ if(pinch) pinch=null; },{passive:true});\n  function dist(e){const a=e.touches[0],b=e.touches[1];\n    return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);}\n}\nfunction mapZoom(f){ const c=MAP.cam; zoomCenter(f); }\nfunction zoomCenter(f){\n  cancelAnimationFrame(MAP.anim);\n  const c=MAP.cam, cx=c.x+c.w/2, cy=c.y+c.h/2;\n  let w=Math.max(MAP.W/160,Math.min(MAP.W*1.8,c.w*f)), h=c.h*(w/c.w);\n  MAP.cam={x:cx-w/2,y:cy-h/2,w,h}; applyCam();\n}\nfunction mapReset(){\n  const shown=[G.start,G.end,...G.guesses.filter(g=>detour(g.code)!==null).map(g=>g.code),...G.revealed];\n  flyTo(unionBox([...new Set(shown)]),700,0.5);\n}\n\n/* ===================================================================\n   6. Views\n   =================================================================== */\nlet route={name:\"daily\"};\nconst $=s=>document.querySelector(s);\nconst esc=s=>String(s).replace(/[&<>\"]/g,c=>({\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c]));\nconst practiceCfg={extra:0,min:4,max:10};\n\nfunction go(name,opts){\n  route=Object.assign({name},opts||{});\n  if(name===\"daily\"){const n=gameNoFor(todayUTC());newGame({mode:\"daily\",no:n,seed:n*7919});}\n  if(name===\"archive-game\"){newGame({mode:\"daily\",no:opts.no,seed:opts.no*7919});route.name=\"daily\";}\n  if(name===\"weekly\"){const mon=todayUTC()-((new Date(todayUTC()).getUTCDay()+6)%7)*DAY;\n    newGame({mode:\"weekly\",no:Math.floor((mon-EPOCH)/DAY/7)+1,seed:mon/DAY*104729,minLen:6,maxLen:12});}\n  if(name===\"practice\") newGame({mode:\"practice\",seed:(Math.random()*1e9)|0,\n    extra:practiceCfg.extra,minLen:practiceCfg.min,maxLen:practiceCfg.max});\n  render(); window.scrollTo(0,0);\n}\nfunction chrome(){\n  const t=T();\n  $(\"#nav-daily\").textContent=t.daily;\n  $(\"#nav-weekly-label\").textContent=t.weekly;\n  $(\"#nav-weekly-flag\").textContent=t.weeklyFlag;\n  $(\"#nav-practice\").textContent=t.practice;\n  $(\"#nav-maps\").textContent=t.maps;\n  $(\"#ads-btn\").textContent=t.removeAds;\n  $(\"#brandsub\").textContent=(route.name===\"practice\"||route.name===\"weekly\")?t.practiceSub:\"\";\n  [\"daily\",\"weekly\",\"practice\",\"maps\"].forEach(k=>{\n    const b=$(\"#nav-\"+k); if(b) b.setAttribute(\"aria-current\",route.name===k?\"true\":\"false\");});\n}\nfunction render(){\n  chrome();\n  const v=$(\"#view\");\n  if(route.name===\"maps\"){v.innerHTML=viewMaps();wireMaps();return;}\n  if(route.name===\"archive\"){v.innerHTML=viewArchive();wireArchive();return;}\n  v.innerHTML=viewGame(); mountMap(); wireGame();\n}\nfunction mountMap(){\n  const host=$(\"#mapholder\"); if(!host) return;\n  const fresh=(MAP.gameKey===null);\n  const svg=buildMap();\n  host.insertBefore(svg,host.firstChild);\n  if(fresh){ MAP.cam=frame(MAP.home,0.6); }   // now measurable at its real aspect\n  mapApplyState(null);\n}\nfunction viewGame(){\n  const t=T(), practice=G.mode!==\"daily\";\n  const hintsLeft=3-G.hints;\n  return `\n  <h1 class=\"route\">${esc(t.routeLead)} <b>${esc(t.routeVerb)}<\/b> ${esc(t.routeFrom)}\n    <b class=\"from\">${esc(NAME(G.start))}<\/b> ${esc(t.routeTo)} <b class=\"to\">${esc(NAME(G.end))}<\/b><\/h1>\n  <div class=\"subrow\">\n    ${practice?`<button class=\"ghost\" id=\"b-new\">&#8635; ${esc(t.newRoute)}<\/button>\n      <button class=\"ghost\" id=\"b-cfg\">&#128295; ${esc(t.configure)}<\/button>`:\"\"}\n    <button class=\"linkish\" id=\"b-share\">&#10148; ${esc(t.share)}<\/button>\n  <\/div>\n  <div class=\"mapbox\" id=\"mapholder\">\n    <div class=\"zoom\">\n      <div class=\"pair\">\n        <button id=\"z-in\" title=\"${esc(t.zoomIn)}\" aria-label=\"${esc(t.zoomIn)}\">+<\/button>\n        <button id=\"z-out\" title=\"${esc(t.zoomOut)}\" aria-label=\"${esc(t.zoomOut)}\">&minus;<\/button>\n      <\/div>\n      <button id=\"z-reset\" title=\"${esc(t.resetMap)}\" aria-label=\"${esc(t.resetMap)}\">&#8635;<\/button>\n    <\/div>\n    ${MAP.real?\"\":`<div class=\"geonote\">${esc(t.offlineMap)}<\/div>`}\n    <div class=\"wm\">travle<\/div>\n  <\/div>\n  <div class=\"ac\">\n    <div class=\"guessrow ${G.over?\"done\":\"\"}\">\n      <input id=\"gi\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\"\n        placeholder=\"${esc(t.placeholder)}\" ${G.over?\"disabled\":\"\"}>\n      <button id=\"gb\">${esc(t.guess)} (${G.guesses.length+1}/${G.max})<\/button>\n    <\/div>\n    <div class=\"aclist hidden\" id=\"ac\"><\/div>\n  <\/div>\n  ${G.over?`<div class=\"endbar\">\n      <button class=\"again\" id=\"e-again\">${esc(t.playAgain)} &#8635;<\/button>\n      <div class=\"side\">\n        <button id=\"e-res\">${esc(t.seeResults)} &#128202;<\/button>\n        <button id=\"e-share\">${esc(t.shareFriends)} &#128203;<\/button>\n      <\/div><\/div>\n    <p class=\"xlinks\"><a href=\"#\" onclick=\"return false\">${esc(t.trivia)}<\/a> &middot;\n       <a href=\"#\" onclick=\"return false\">${esc(t.flagle)}<\/a><\/p>`:\"\"}\n  <button class=\"toggle note\" id=\"b-prev\">${esc(t.prev)}<\/button>\n  ${G.showPrev?`<div class=\"chips\">${G.guesses.map((g,i)=>chipHtml(g,i)).join(\"\")}<\/div>`:\"\"}\n  ${G.over?\"\":`<div class=\"note\">${esc(t.hintCount)} (${G.hints}/3):<\/div>\n  <div class=\"hints\">\n    <button class=\"hint ${hintsLeft?\"live\":\"\"}\" id=\"h1\" ${hintsLeft?\"\":\"disabled\"}>${esc(t.hint1)}<\/button>\n    <button class=\"hint ${hintsLeft?\"live\":\"\"}\" id=\"h2\" ${hintsLeft?\"\":\"disabled\"}>${esc(t.hint2)}<\/button>\n    <button class=\"hint ${hintsLeft?\"live\":\"\"}\" id=\"h3\" ${hintsLeft?\"\":\"disabled\"}>${esc(t.hint3)}<\/button>\n  <\/div>`}`;\n}\nconst sqClass=g=> g.d===null?\"sq-far\": g.d===0?\"sq-ok\": g.d<=2?\"sq-near\":\"sq-far\";\nconst chipHtml=(g,i)=>`<span class=\"chip\"><i>${i+1}.<\/i>${esc(NAME(g.code))}<s class=\"${sqClass(g)}\"><\/s><\/span>`;\n\nfunction wireGame(){\n  const inp=$(\"#gi\"), list=$(\"#ac\"); let sel=-1, items=[];\n  const close=()=>{list.classList.add(\"hidden\");sel=-1;items=[];};\n  if(inp){\n    inp.addEventListener(\"input\",()=>{\n      const s=norm(inp.value); if(!s) return close();\n      items=CODES.filter(c=>norm(NAME(c)).startsWith(s)).slice(0,8);\n      if(!items.length) items=CODES.filter(c=>norm(NAME(c)).includes(s)).slice(0,8);\n      if(!items.length) return close();\n      list.innerHTML=items.map((c,i)=>`<div data-c=\"${c}\" aria-selected=\"${i===sel}\">${esc(NAME(c))}<\/div>`).join(\"\");\n      list.classList.remove(\"hidden\");\n    });\n    inp.addEventListener(\"keydown\",e=>{\n      if(e.key===\"ArrowDown\"||e.key===\"ArrowUp\"){\n        if(!items.length) return; e.preventDefault();\n        sel=(sel+(e.key===\"ArrowDown\"?1:items.length-1))%items.length;\n        [...list.children].forEach((d,i)=>d.setAttribute(\"aria-selected\",i===sel));\n      } else if(e.key===\"Enter\"){\n        e.preventDefault();\n        const v=sel>=0?NAME(items[sel]):inp.value; inp.value=\"\"; close(); submitGuess(v);\n      } else if(e.key===\"Escape\") close();\n    });\n    list.addEventListener(\"mousedown\",e=>{\n      const d=e.target.closest(\"[data-c]\"); if(!d) return;\n      e.preventDefault(); const v=NAME(d.dataset.c); inp.value=\"\"; close(); submitGuess(v);\n    });\n    inp.addEventListener(\"blur\",()=>setTimeout(close,120));\n    if(!G.over) inp.focus();\n  }\n  $(\"#gb\").onclick=()=>{const v=inp.value;inp.value=\"\";submitGuess(v);};\n  $(\"#z-in\").onclick=()=>zoomCenter(0.65);\n  $(\"#z-out\").onclick=()=>zoomCenter(1.5);\n  $(\"#z-reset\").onclick=mapReset;\n  $(\"#b-prev\").onclick=()=>{G.showPrev=!G.showPrev;render();};\n  $(\"#b-share\").onclick=shareRoute;\n  const bn=$(\"#b-new\"); if(bn) bn.onclick=()=>go(\"practice\");\n  const bc=$(\"#b-cfg\"); if(bc) bc.onclick=openConfig;\n  [\"h1\",\"h2\",\"h3\"].forEach((id,i)=>{const b=$(\"#\"+id); if(b) b.onclick=()=>hint(i+1);});\n  const ea=$(\"#e-again\"); if(ea) ea.onclick=()=>go(G.mode===\"daily\"?\"practice\":\"practice\");\n  const er=$(\"#e-res\"); if(er) er.onclick=openResults;\n  const es=$(\"#e-share\"); if(es) es.onclick=copyResult;\n}\nfunction hint(n){\n  if(G.hints>=3||G.over) return;\n  G.hints++;\n  const rest=G.path.slice(1,-1).filter(c=>!G.guesses.some(g=>g.code===c));\n  if(n===1){ const nx=rest.find(c=>!G.revealed.includes(c)); if(nx) G.revealed.push(nx); }\n  else { rest.forEach(c=>{ if(!G.revealed.includes(c)) G.revealed.push(c); });\n         if(n===3) G.showInitials=true; }\n  render();\n  const last=G.revealed[G.revealed.length-1];\n  if(last) flyTo(unionBox([last,G.end]),800,0.8);\n}\nfunction shareRoute(){\n  const txt=`${T().routeVerb}: ${NAME(G.start)} \u2192 ${NAME(G.end)}`;\n  navigator.clipboard?.writeText(txt).then(()=>toast(T().copied),()=>toast(T().copied));\n}\nfunction copyResult(){\n  const sq=G.guesses.map(g=> g.d===null?\"\ud83d\udfe5\": g.d===0?\"\ud83d\udfe9\": g.d<=2?\"\ud83d\udfe7\":\"\ud83d\udfe5\").join(\"\");\n  const head=G.mode===\"daily\"?`travle #${G.no}`:\"travle\";\n  navigator.clipboard?.writeText(`${head} ${G.win?G.guesses.length:\"X\"}/${G.max}\\n${sq}`)\n    .then(()=>toast(T().copied),()=>toast(T().copied));\n}\n\n/* ---- maps page ---- */\nlet mapsTab=\"pinned\", mapsQ=\"\";\nconst MODE_CARDS=[\n  {id:\"daily\",cat:\"pinned global\",tint:\"var(--mint)\",key:\"cardDaily\",go:( t(); else toast(\"\u2014\");\n    });\n  });\n}\nfunction openSettings(){\n  const t=T();\n  openLayer(modal(\"&#9881; \"+esc(t.settings),`\n    <div class=\"field\"><label>${esc(t.scheme)}<\/label><div class=\"seg\" id=\"seg-theme\">\n      <button data-th=\"light\" aria-pressed=\"${prefs.theme===\"light\"}\">&#9728;<\/button>\n      <button data-th=\"dark\" aria-pressed=\"${prefs.theme===\"dark\"}\">&#9789;<\/button><\/div><\/div>\n    <div class=\"field\"><label>${esc(t.projection)}<\/label><select id=\"sel-proj\">\n      <option value=\"azimuthal\" ${prefs.proj===\"azimuthal\"?\"selected\":\"\"}>${esc(t.projA)}<\/option>\n      <option value=\"equirect\" ${prefs.proj===\"equirect\"?\"selected\":\"\"}>${esc(t.projB)}<\/option>\n      <option value=\"mercator\" ${prefs.proj===\"mercator\"?\"selected\":\"\"}>${esc(t.projC)}<\/option><\/select><\/div>\n    <div class=\"field\"><label>${esc(t.language)}<\/label><select id=\"sel-lang\">\n      <option value=\"nl\" ${prefs.lang===\"nl\"?\"selected\":\"\"}>Nederlands<\/option>\n      <option value=\"en\" ${prefs.lang===\"en\"?\"selected\":\"\"}>English<\/option><\/select><\/div>\n    <a href=\"#\" onclick=\"return false\">${esc(t.privacyPolicy)}<\/a>`,\n    `<footer><button class=\"btn-primary\" data-close>${esc(t.done)}<\/button><\/footer>`),()=>{\n    document.querySelectorAll(\"#seg-theme button\").forEach(b=>b.onclick=()=>{\n      prefs.theme=b.dataset.th; savePrefs(); render(); openSettings(); });\n    $(\"#sel-proj\").onchange=e=>{prefs.proj=e.target.value;savePrefs();};\n    $(\"#sel-lang\").onchange=e=>{prefs.lang=e.target.value;savePrefs();\n      MAP.gameKey=null;render();closeLayer();openSettings();};\n  });\n}\nfunction openStats(){\n  const t=T();\n  const keys=[\"0\",\"1\",\"2\",\"3\",\"4\",\"5\",\"6\",\"X\"];\n  const labels=[t.perfect,\"+1\",\"+2\",\"+3\",\"+4\",\"+5\",\"+6\",t.failed];\n  const total=Math.max(1,...keys.map(k=>stats.dist[k]||0));\n  const rows=keys.map((k,i)=>{\n    const v=stats.dist[k]||0;\n    return `<div style=\"display:flex;align-items:center;gap:8px;font-size:.85rem;margin-bottom:5px\">\n      <i style=\"font-style:normal;width:56px;color:var(--ink-dim)\">${esc(labels[i])}<\/i>\n      <u style=\"text-decoration:none;background:var(--mint-deep);color:#fff;border-radius:3px;\n        padding:1px 7px;min-width:26px;text-align:right;width:${Math.max(8,v/total*100)}%\">${v}<\/u><\/div>`;\n  }).join(\"\");\n  openLayer(modal(\"&#128202; \"+esc(t.stats),`<div class=\"stats\">\n      <div><b>${stats.played}<\/b><span>${esc(t.played)}<\/span><\/div>\n      <div><b>${stats.played?Math.round(stats.won/stats.played*100):0}<\/b><span>${esc(t.winPct)}<\/span><\/div>\n      <div><b>${stats.streak}<\/b><span>${esc(t.streak)}<\/span><\/div>\n      <div><b>${stats.best}<\/b><span>${esc(t.best)}<\/span><\/div><\/div>\n    <p style=\"color:var(--ink-dim);margin:0 0 8px;font-weight:600\">${esc(t.distribution)}<\/p>${rows}`,\n    `<footer><button class=\"btn-primary\" data-close>${esc(t.done)}<\/button><\/footer>`));\n}\nfunction openHow(){\n  const t=T();\n  openLayer(modal(\"&#10068; \"+esc(t.how),\n    t.howBody.map(p=>`<p style=\"color:var(--ink-dim);margin:0 0 10px\">${esc(p)}<\/p>`).join(\"\"),\n    `<footer><button class=\"btn-primary\" data-close>${esc(t.done)}<\/button><\/footer>`));\n}\nfunction openAccount(){\n  const t=T();\n  const b=(i,l)=>`<button class=\"ghost\" style=\"display:flex;gap:10px;align-items:center;padding:11px 16px\">${i} ${esc(l)}<\/button>`;\n  openLayer(modal(\"&#128100; \"+esc(t.account),\n    `<p style=\"color:var(--ink-dim);margin:0 0 4px\">${esc(t.accountBody)}<\/p>\n     <a href=\"#\" onclick=\"return false\">${esc(t.learnMore)}<\/a>\n     <div style=\"display:flex;justify-content:center;margin:18px 0 8px\">${b(\"&#9993;\",t.loginEmail)}<\/div>\n     <div style=\"display:flex;gap:10px;flex-wrap:wrap;justify-content:center\">\n       ${b(\"&#120143;\",t.loginX)}${b(\"G\",t.loginGoogle)}${b(\"&#63743;\",t.loginApple)}<\/div>`,\n   frame.srcdoc = GAMES[id].html;
  document.getElementById('ptitle').textContent = GAMES[id].title;
  sw.innerHTML = Object.keys(GAMES).map(k=>`<button data-k="${k}" class="${k===id?'on':''}">${GAMES[k].title}</button>`).join('');
  player.classList.add('open');
  document.body.style.overflow = 'hidden';
  if (push !== false){ try{ history.pushState({g:id}, '', '#'+id); }catch(e){ location.hash = id; } }
}
function close(push){
  player.classList.remove('open');
  frame.srcdoc = '';
  current = null;
  document.body.style.overflow = '';
  if (push !== false){ try{ history.pushState({}, '', location.pathname + location.search); }catch(e){ location.hash = ''; } }
}
document.getElementById('grid').addEventListener('click', e=>{
  const g = e.target.closest('.game'); if (g) open(g.dataset.id);
});
sw.addEventListener('click', e=>{ const b = e.target.closest('button'); if (b) open(b.dataset.k); });
document.getElementById('back').addEventListener('click', ()=>close());
document.addEventListener('keydown', e=>{ if (e.key==='Escape' && current) close(); });
window.addEventListener('popstate', ()=>{
  const id = location.hash.slice(1);
  if (GAMES[id]) open(id, false); else if (current) close(false);
});
if (GAMES[location.hash.slice(1)]) open(location.hash.slice(1), false);
</script>
</body>
</html>
